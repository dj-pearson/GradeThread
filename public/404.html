<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- US-422: a genuinely unknown URL. This document is served with an HTTP
         404 status (see public/_redirects "/* /404.html 404"), so crawlers see a
         hard 404 instead of a soft 404 SPA shell. noindex belt-and-suspenders. -->
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | GradeThread</title>
    <meta
      name="description"
      content="The page you're looking for doesn't exist or has moved."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --navy: #0f3460;
        --red: #e94560;
        --night: #1a1a2e;
        --gray: #f5f5f5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        background: var(--gray);
        color: var(--night);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      main {
        max-width: 30rem;
      }
      img {
        height: 2.25rem;
        width: auto;
        margin-bottom: 2rem;
      }
      .code {
        font-size: 4rem;
        font-weight: 700;
        color: var(--navy);
        margin: 0;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0.5rem 0 0.75rem;
        color: var(--navy);
      }
      p {
        margin: 0 0 1.75rem;
        color: #475569;
      }
      a.home {
        display: inline-block;
        background: var(--navy);
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: background 0.15s ease;
      }
      a.home:hover {
        background: var(--red);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo_primary.png" alt="GradeThread" />
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        The page you're looking for doesn't exist, has moved, or the link was
        mistyped.
      </p>
      <a class="home" href="/">Back to GradeThread</a>
    </main>
  </body>
</html>
