<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
    </style>
    <!-- Premium drop shadow for the 3D SaaS feel -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Deep Navy Background -->
  <rect width="512" height="512" rx="112" fill="#0F3460" />
  
  <!-- GT Text in Vibrant Red -->
  <g font-family="Inter, sans-serif" font-weight="900" font-size="240" fill="#E94560" letter-spacing="-5">
    <text x="100" y="360">G</text>
    <text x="280" y="360">T</text>
  </g>
  
  <!-- Thread Tail (Behind Needle, sticking out the back of the eye) -->
  <path d="M 225 155 C 235 175, 260 170, 270 150" fill="none" stroke="#E94560" stroke-width="14" stroke-linecap="round" />
  
  <!-- Needle (White, intersecting the front) -->
  <g transform="translate(225, 155) rotate(60)" filter="url(#shadow)">
    <!-- Main needle body -->
    <path d="M -12 35 L 12 35 L 4 -180 L -4 -180 Z" fill="#FFFFFF" />
    <!-- Needle tip -->
    <path d="M -4 -180 L 4 -180 L 0 -230 Z" fill="#FFFFFF" />
    <!-- Needle top curve -->
    <path d="M -12 35 C -12 60, 12 60, 12 35 Z" fill="#FFFFFF" />
    <!-- Eye hole -->
    <rect x="-4.5" y="-5" width="9" height="40" rx="4.5" fill="#0F3460" />
  </g>
  
  <!-- Main Thread (Comes out of the right side of the T, loops around and goes into the needle eye) -->
  <path d="M 405 200 C 520 200, 540 350, 440 440 C 320 540, 80 500, 60 350 C 30 200, 120 100, 225 155" 
        fill="none" stroke="#E94560" stroke-width="24" stroke-linecap="round" filter="url(#shadow)" />
        
</svg>
