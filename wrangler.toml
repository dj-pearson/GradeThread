# Cloudflare PAGES configuration.
#
# This is a Pages project (static SPA in ./dist + Pages Functions in ./functions),
# NOT a Workers Sites project. Pages REQUIRES `pages_build_output_dir`; the old
# `[site].bucket` key is Workers-Sites-only and is rejected by the Pages build
# validator, which silently skips deploying the `functions/` directory. That is
# why every dynamic route served by a Pages Function — /sitemap.xml, /robots.txt,
# /llms.txt, /rss.xml, the blog SSR (/blog, /blog/*), certificate SSR (/cert/*),
# OG images, etc. — was returning 404 and the site could not be indexed.
#
# With `pages_build_output_dir` set, Cloudflare auto-detects ./functions, builds
# it into Pages Functions, and auto-generates the _routes.json so those paths
# invoke the Functions instead of falling through to the SPA `_redirects` splat.
name = "gradethread"
compatibility_date = "2024-09-25"
pages_build_output_dir = "./dist"

# ── Pages Functions RUNTIME environment variables ──────────────────────────
# IMPORTANT: `[vars]` here are exposed to the Pages Functions in ./functions/ at
# RUNTIME (via context.env) ONLY. They are NOT available during the build, so
# the React app's build-time `VITE_*` vars (VITE_SUPABASE_URL,
# VITE_SUPABASE_ANON_KEY, etc., baked into the JS bundle by Vite) DO NOT belong
# here — those live in `.env.production` (committed) or the Pages dashboard
# build env vars. See https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Only NON-SECRET values may go here as plaintext (this file is committed).
# Server secrets (service-role keys, Stripe secret, etc.) must be set as Pages
# *secrets* (`npx wrangler pages secret put NAME`) or in the dashboard — never
# here. The Functions read these via the PagesEnv interface in
# functions/_shared/blog-render.ts.
[vars]
PUBLIC_SITE_URL = "https://gradethread.com"
EDGE_API_URL = "https://functions.gradethread.com"
# Gates the blog SSR /cdn-cgi/image srcset — see imageResizingEnabled().
# VERIFIED LIVE 2026-08-03: Transformations ARE enabled on this zone.
#   curl -sI "https://gradethread.com/cdn-cgi/image/width=320,format=auto/logo_primary.png"
#   -> HTTP/1.1 200 OK, Content-Type: image/avif  (125,781 B -> 5,420 B, -95.7%)
# The flag had been left "false" waiting on a dashboard step that was
# already done, so every image shipped full-size in its original format.
VITE_CF_IMAGE_RESIZING = "true"

# Preview deployments inherit the same non-secret runtime config.
[env.preview.vars]
PUBLIC_SITE_URL = "https://gradethread.com"
EDGE_API_URL = "https://functions.gradethread.com"
VITE_CF_IMAGE_RESIZING = "true"
