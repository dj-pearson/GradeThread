# US-1300: pinned versions for reproducible builds. Bump deliberately, one at a
# time, with a green `gradlew assembleDebug test lint` before committing.
#
# US-2906 AC2: WHAT IS HELD BACK, AND WHY. Measured 2026-08-29 by
# `npm run android:updates`: 86 of 100 dependencies are behind and 16 are at
# least one major behind. The reasons for the majors are recorded beside their
# pins below.
#
# THE FULL LIST IS NOT COPIED HERE, deliberately. It moves when Google
# publishes, not when this repo changes, so a list in this file would be stale
# within a week and would then read as current. The monthly drift workflow
# (.github/workflows/android-dependency-drift.yml, US-2906 AC5) regenerates it
# and keeps ONE labelled issue in sync - it closes the issue when nothing is
# behind, so its existence is the signal. Read that, not a comment.
#
# The minors and patches carry no individual reason: they are held only because
# AC4's gate has not been met, which is one decision about all of them rather
# than 70 decisions. That gate is a real-device smoke pass. The screenshot lane
# became BLOCKING on 2026-08-29 and covers 11 goldens, but 49 of the app's 52
# screens still take a ViewModel and have none (US-2902 AC3), so a padding
# change on the publish screen or the grade report remains invisible to CI.
[versions]
# HELD: 9.3.2 is out. AGP, Gradle (8.13 -> 9.7.1), the nine
# com.android.tools.utp artefacts (31 -> 32) and spotless (7 -> 8) are ONE piece
# of work, not four: `dependencyUpdates` already emits configuration-cache
# problems from the plugin and Gradle warns this build "is incompatible with
# Gradle 9.0", so the toolchain has prerequisite work before the version moves.
agp = "8.13.2"
# HELD: 2.4.10 is out. Numbered a minor by JetBrains and a compiler change in
# practice, so it travels with the AGP/Gradle jump above rather than alone.
kotlin = "2.1.20"
ksp = "2.1.20-2.0.0"
coreKtx = "1.15.0"
coreSplashscreen = "1.0.1"
# US-1393: per-app locales. AppCompatDelegate.setApplicationLocales is the only
# API that works below Android 13, and it needs the library present even though
# this app uses ComponentActivity rather than AppCompatActivity.
appcompat = "1.7.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
# HELD: 2026.08.00 is out - SIXTEEN MONTHS of Material 3, and the single
# largest visual risk in the set. The blocking screenshot lane would catch a
# change to any of its 11 goldens; it would not catch one on the 49 screens
# that have none. This is the pin that most needs AC4's real-device pass.
composeBom = "2025.04.00"
navigationCompose = "2.8.9"
hilt = "2.56"
hiltNavigationCompose = "1.2.0"
room = "2.7.0"
datastore = "1.1.4"
coroutines = "1.10.1"
coil = "2.7.0"
# HELD: 5.5.0 is out, and it is an API-breaking major. mockwebserver moves
# with it (4.12.0 -> 5.5.0), so the test sources change in the same pass.
okhttp = "4.12.0"
supabase = "3.1.4"
ktor = "3.1.2"
# DEPRECATED UPSTREAM, and pinned here deliberately rather than by neglect.
#
# androidx.security:security-crypto never reached a stable 1.1.0 and Google has
# since deprecated it with no replacement library planned. It is the store for
# the Supabase refresh token, so this is the most load-bearing alpha dependency
# in the app and the fact belongs where the version is, not in a ticket.
#
# NOT BUMPED, and not migrated off, on purpose:
#
#  - alpha07 is the last published build and carries no fix this app needs. A
#    version bump on a dependency holding credentials is a change to make with a
#    release-candidate device in hand, not on the way past.
#  - the replacement is hand-written Keystore AES-GCM over DataStore. That is
#    fifty lines of cryptography whose failure mode is either "everyone is
#    signed out" or, much worse, "the token is stored weakly and nothing looks
#    different". It is a story with a device behind it.
#
# What DID change is the failure mode. EncryptedSharedPreferences.create raises
# on an unreadable keyset - a restored backup, a Keystore entry invalidated by a
# lock-screen change, an interrupted write - and it is called from inside
# Application.onCreate, so an uncaught throw was a permanent crash on launch.
# EncryptedSessionManager now carries the same recovery ladder DatabaseProvider
# does. The deprecation is a cost to plan for; that crash was a bug.
securityCrypto = "1.1.0-alpha06"
# HELD: 8.54.0 is out, an API-breaking major. Sentry is the crash reporter, so
# a bad upgrade is silent - it stops reporting rather than failing a build.
# Worth its own pass with a deliberate test event afterwards.
sentry = "7.22.0"
posthog = "3.11.2"
browser = "1.8.0"
biometric = "1.1.0"
camerax = "1.4.2"
# Bundled ML Kit, not the play-services variant: the models ship IN THE APK, so
# scanning works offline and on a Play-less device. (The older claim here that
# the app pulls in "no GMS at all" was never true — bundled ML Kit still brings
# play-services-basement + tasks; the bundling is about the MODELS.)
mlkitBarcode = "17.3.0"
# Latin covers 6 of the 7 iOS recognition languages (en/fr/es/de/it/pt).
# Japanese is a separate script model, added for parity: the brand
# whitelist carries BAPE and Stussy, whose tags are routinely Japanese.
mlkitTextRecognition = "16.0.1"
exifinterface = "1.4.0"
workManager = "2.10.0"
# US-1380: home-screen widgets. Glance renders to RemoteViews, so the widget
# layout is NOT Compose UI at runtime and cannot share a single component with
# the app — everything drawable is redeclared in `widget/`.
glance = "1.1.1"
# US-1338: Play Billing. NOTE: this DOES pull com.google.android.gms
# play-services-base + basement transitively (verified against the resolved
# debugRuntimeClasspath, not assumed). It is the only way to take a Play
# purchase, so the dependency is accepted deliberately — on a Play-less device
# billing is simply unavailable, which is the correct outcome for a store
# purchase. See the ML Kit note above: its old "no GMS at all" claim was
# already inaccurate before this landed (bundled ML Kit pulls basement + tasks);
# what it actually buys is that the barcode/text MODELS ship in the APK rather
# than being downloaded from Play, so scanning works with no network and on a
# Play-less device. That property is unaffected by this dependency.
# HELD, AND OWNED BY US-2901 rather than by this file. 9.1.0 is current, so
# this is TWO majors behind - US-2901 AC2 as written asks for 8.x, which is
# itself already superseded and would need doing twice. Whoever takes it must
# re-read Play's minimum-version page (that story's own AC1) before moving the
# pin: Play enforces a FLOOR here, so this one has a deadline the rest do not.
billing = "7.1.1"

# US-1378: FCM push. Added WITHOUT the google-services Gradle plugin, so no
# google-services.json is needed to build — Firebase is initialized manually
# from BuildConfig values (see PushConfig), exactly like the Sentry DSN. An
# unconfigured build simply has no push, which is the correct outcome for a
# fork or a CI checkout that has no Firebase project.
# HELD: 34.18.0 is out, a major. Bundled SDKs are what AC6 is about - one that
# starts collecting an advertising id makes the Play Data safety declaration
# false with no change to our code, so this pin cannot move without re-checking
# that form.
firebaseBom = "33.7.0"
lifecycleProcess = "2.8.7"
serialization = "1.8.0"
junit = "4.13.2"
# US-2891: 4.16.1, not 4.14.1, and the version is coupled to compileSdk.
#
# Robolectric ships one android-all jar per SDK level and refuses to run
# against a level it has never seen. Moving compileSdk to 36 therefore broke
# every Robolectric test at once - 21 classes, all `initializationError` out of
# DefaultSdkPicker, which names neither Robolectric's version nor the SDK.
# 4.16 is the first release with Baklava/SDK 36; 4.16.1 is the current stable.
#
# The failure is worth remembering because of its SHAPE: the 1798 plain JUnit
# tests all passed, so the suite looked ~99% healthy while the entire
# Robolectric half - including the Roborazzi screenshot lane, which runs
# through it - was not executing at all. Raise this in the same commit as any
# future compileSdk bump.
robolectric = "4.16.1"
androidxTestCore = "1.6.1"
# US-1395: the instrumented lane. An emulator test is the only thing that can
# catch a Hilt graph that fails at runtime or a crash in Application.onCreate —
# no JVM unit test constructs the real object graph.
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"

# --- Quality tooling (US-2502). Everything below replaces something Android
# --- Studio does behind a menu item, so it can run on a laptop with no IDE and
# --- in CI on every push.
# Detekt = "Analyze > Inspect Code" for Kotlin: complexity, dead code, empty
# blocks, exception swallowing. Nothing else in this project checks any of it.
detekt = "1.23.8"
# Compose-specific detekt rules (unstable collection params, missing modifier,
# a mutable state hoisting mistake) -- the class of bug that compiles, renders,
# and just recomposes forever.
detektCompose = "0.4.28"
# Spotless drives ktlint = "Reformat Code", as a gate rather than a habit.
# HELD: 8.10.1 is out. Travels with the AGP and Gradle jump at the top of this
# file - and note the ratchet, which makes a spotless bump wider than it looks:
# touching an old .kt file makes you own its accumulated ktlint debt.
spotless = "7.2.1"
ktlint = "1.5.0"
# Kover = the coverage gutter, as a number with a floor under it.
kover = "0.9.9"
# Google's Play SDK Index + Compose lint rules run inside Android Lint.
composeLintChecks = "1.4.3"
# Report-only "a newer version exists", which is the Studio dependency
# inspection with no IDE attached.
versionsPlugin = "0.52.0"
# Roborazzi renders Composables to PNG on the JVM through Robolectric's native
# graphics -- no emulator, no device. That is the Compose Preview pane and
# Layout Validation, as a test that fails when a screen changes shape.
# Pinned to the 1.44 line: it is the one built against Robolectric 4.14.x,
# which is what this project already runs.
roborazzi = "1.44.0"

