# US-1300: pinned versions for reproducible builds. Bump deliberately, one at a
# time, with a green `gradlew assembleDebug test lint` before committing.
[versions]
agp = "8.9.2"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.04.00"
navigationCompose = "2.8.9"
hilt = "2.56"
hiltNavigationCompose = "1.2.0"
room = "2.7.0"
datastore = "1.1.4"
coroutines = "1.10.1"
coil = "2.7.0"
okhttp = "4.12.0"
supabase = "3.1.4"
ktor = "3.1.2"
securityCrypto = "1.1.0-alpha06"
sentry = "7.22.0"
posthog = "3.11.2"
browser = "1.8.0"
biometric = "1.1.0"
lifecycleProcess = "2.8.7"
serialization = "1.8.0"
junit = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"

[libraries]
