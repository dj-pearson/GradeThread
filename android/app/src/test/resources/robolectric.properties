# Robolectric config for the JVM unit tests (US-2502).
#
# application: use a PLAIN android.app.Application, not the one the manifest
# names.
#
# Turning on `isIncludeAndroidResources` gave Robolectric the merged resource
# table — which is what the screenshot tests need — and, as a side effect, the
# merged MANIFEST. Robolectric then started instantiating the Application it
# names, which is `GradeThreadApp` (@HiltAndroidApp). That builds the real
# Dagger singleton graph, NetworkModule constructs SupabaseShared, and
# SupabaseShared builds an EncryptedSessionManager on top of
# androidx.security.crypto.MasterKey. There is no AndroidKeyStore provider on
# a JVM, so every Robolectric test died in setup with
# "java.security.KeyStoreException: AndroidKeyStore not found" — 161 of them.
#
# None of these tests wants the app object. They test a merge, a parser, a
# store, a composable. Before the resources flag they ran against Robolectric's
# default Application and passed; this line keeps that and keeps the resources.
#
# A test that DOES need the injected graph should say so per-class with
# @HiltAndroidTest + HiltTestApplication via @Config(application = …), rather
# than this file changing back — the instrumented suite already has
# HiltTestRunner for the cases that need a real device anyway.
application=android.app.Application
