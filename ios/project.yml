name: GradeThread
options:
  bundleIdPrefix: com.gradethread
  deploymentTarget:
    # iOS 18.0 floor (US-985): SwiftData's #Index / #Unique macros are 18.0+.
    # The offline cache models declare #Index to keep predicated/sorted fetches
    # off full table scans, which requires the deployment target be ≥ 18.0.
    # The app is pre-launch, so dropping iOS 17 costs nothing here.
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"   # US-985: SwiftData #Index is iOS 18+
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (US-193)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # set in env or .xcconfig; placeholder for CI
    # Version source of truth. The Info.plist of every target references
    # these via $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION), so the CI
    # release workflow can override them: MARKETING_VERSION (the 1.0.0-style
    # release number) is set manually on workflow_dispatch or derived from an
    # ios-v* tag; CURRENT_PROJECT_VERSION (the build number) is the GitHub run
    # number. Bump MARKETING_VERSION here to change the default release number.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"

# Apps are built unsigned in CI for tests; the release workflow injects a
# code-signing identity via App Store Connect API key + manual provisioning.
configs:
  Debug: debug
  Release: release

packages:
  # Official Supabase SDK — auth + realtime DB + storage. Pinned to 2.x; we
  # bump intentionally rather than chasing minor releases automatically.
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
  # Crash reporting + breadcrumbs (US-191). DSN comes from xcconfig.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0
  # Product analytics (US-191). Opt-in via UserDefaults; calls no-op
  # when the toggle is off.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0

targets:
  GradeThread:
    type: application
    platform: iOS
    sources:
      - path: GradeThread
      - path: Shared            # IntakeInbox + future cross-target helpers (US-189)
    resources:
      - path: GradeThread/Assets.xcassets
      # US-654: brand typefaces (Outfit display + Inter body/UI). Static
      # weights instanced from the OFL variable fonts; referenced by their
      # PostScript names via the Typography scale.
      - path: GradeThread/Resources/Fonts
    # PrivacyInfo.xcprivacy (US-197) is picked up by the GradeThread source
    # glob above; XcodeGen classifies .xcprivacy into the resources phase.
    configFiles:
      Debug: GradeThread/Config/Debug.xcconfig
      Release: GradeThread/Config/Release.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
      - target: ShareExtension
        embed: true             # Bundle the extension in the host app (US-189)
      - target: GradeThreadWidget
        embed: true             # Bundle the widget extension in the host app (US-190)
    info:
      path: GradeThread/Info.plist
      properties:
        CFBundleDisplayName: GradeThread
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "GradeThread uses the camera to capture garment photos for grading and to scan SKU barcodes when cataloging items."
        NSPhotoLibraryUsageDescription: "GradeThread imports photos from your library so you can grade existing garment shots."
        # US-768: save the certified "graded photo" (digital slab) to Photos.
        NSPhotoLibraryAddUsageDescription: "GradeThread saves your certified graded photo to your library so you can post it with your listings."
        # US-696: optional Face ID / passcode app lock.
        NSFaceIDUsageDescription: "GradeThread can use Face ID to lock the app so your sales, payouts, and account stay private."
        ITSAppUsesNonExemptEncryption: false
        # US-654: register the bundled brand typefaces so Font.custom can
        # resolve them by PostScript name (graceful system fallback if a face
        # ever fails to load).
        UIAppFonts:
          - Outfit-Regular.ttf
          - Outfit-SemiBold.ttf
          - Outfit-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-Bold.ttf
        # Runtime config read by AppConfig, surfaced from the active xcconfig
        # via build-setting substitution ($(...) is expanded at build time).
        # These MUST live here: XcodeGen regenerates GradeThread/Info.plist
        # from this block on every `xcodegen generate`, so keys present only
        # in a committed Info.plist get stripped at generate time.
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        EDGE_API_URL: "$(EDGE_API_URL)"
        # US-368: Cloudflare Turnstile site key. Empty in xcconfig; the release
        # workflow injects the real key from Infisical at archive time (like
        # SUPABASE_ANON_KEY). Empty → captcha is a no-op (local/CI).
        TURNSTILE_SITE_KEY: "$(TURNSTILE_SITE_KEY)"
        SENTRY_DSN: "$(SENTRY_DSN)"
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
        POSTHOG_HOST: "$(POSTHOG_HOST)"
        # Multi-window on iPad (US-193).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        # Opportunistic background sync (US-188). The identifier must match
        # what BGTaskScheduler registers at launch.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.gradethread.app.refresh
        # Voice dictation in the manual intake form (US-179).
        NSSpeechRecognitionUsageDescription: "GradeThread uses speech recognition so you can dictate notes hands-free while sourcing items."
        NSMicrophoneUsageDescription: "GradeThread needs the microphone to capture your voice for dictation."
        # Custom URL scheme so Supabase OAuth redirects return to the app.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.gradethread.app.oauth
            CFBundleURLSchemes:
              - com.gradethread.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradethread.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: GradeThread/GradeThread.entitlements
      configs:
        # Manual App Store signing for archive/TestFlight so the archive actually
        # signs as Distribution and BAKES CODE_SIGN_ENTITLEMENTS into the binary.
        # (Automatic archive signing was resolving to Development and dropping
        # applesignin/associated-domains/app-groups → SIWA AuthorizationError
        # 1000.) Scoped to Release + this target only, so the Swift Package deps
        # and Debug/CI test builds are untouched. The matching App Store profile
        # is installed by the release workflow; the specifier name must match it.
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER: "GradeThread App Store"
    scheme:
      testTargets:
        - GradeThreadTests
      gatherCoverageData: true

  GradeThreadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GradeThreadTests
      # NOTE: do NOT add `- path: Shared` here. Shared/ is already compiled into
      # the GradeThread app target (below), so tests reach IntakeInbox /
      # WidgetSnapshot / WidgetDeepLink (all public) via `@testable import
      # GradeThread`. Listing Shared here too compiled a SECOND copy of those
      # types into the test module, so e.g. a test-built WidgetSnapshot no longer
      # matched the app's WidgetSnapshot? parameter ("cannot convert value of
      # type 'WidgetSnapshot' to expected argument type 'WidgetSnapshot?'").
    dependencies:
      - target: GradeThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradethread.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  # Share Extension (US-189). Lets users send 1-8 images from Photos.app /
  # any share sheet straight into a FlipDesk intake. Communicates with the
  # main app via App Group container `group.com.gradethread.app`; the main
  # app drains the inbox on next foreground.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared            # Same IntakeInbox the main app uses
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to FlipDesk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required for the OS to install the appex. XcodeGen regenerates
        # this plist, so the NSExtension dict must live here. Accept up to
        # 8 image attachments; the extension hides on text/URL/video shares.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 8
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradethread.app.share-extension
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        # Extension UIs are size-constrained — explicit so XcodeGen
        # doesn't auto-add device-family quirks.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # See GradeThread target — manual App Store signing for Release only.
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER: "GradeThread ShareExtension AppStore"

  # Widget extension (US-190). Home-screen widget showing today's
  # selling snapshot + pending payout. Reads the rollup the main app
  # publishes to the App Group container — no network, no DB.
  GradeThreadWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GradeThreadWidget
      - path: Shared            # WidgetSnapshot + store shared with the app
    resources:
      # US-657: bundle the brand asset catalog into the widget appex so it can
      # reference the shared BrandNavy/BrandRed colorsets (with light/dark
      # variants) instead of hardcoded hex literals.
      - path: GradeThread/Assets.xcassets
    info:
      path: GradeThreadWidget/Info.plist
      properties:
        CFBundleDisplayName: GradeThread
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required for the OS to install the appex — WidgetKit's extension
        # point. XcodeGen regenerates this plist, so it must live here (not
        # only in the committed Info.plist, which gets overwritten).
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradethread.app.widget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: GradeThreadWidget/GradeThreadWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # See GradeThread target — manual App Store signing for Release only.
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER: "GradeThread Widget AppStore"

  # UI-test target for App Store screenshot capture via fastlane snapshot
  # (US-197). Deliberately NOT in the GradeThread scheme's test action so
  # PR/unit CI stays fast — driven instead by the dedicated
  # GradeThreadScreenshots scheme below.
  GradeThreadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GradeThreadUITests
    dependencies:
      - target: GradeThread
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gradethread.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

# Dedicated scheme for fastlane snapshot so screenshot runs don't bloat
# the unit-test action on every PR. fastlane/Snapfile points here.
schemes:
  GradeThreadScreenshots:
    build:
      targets:
        GradeThread: all
        GradeThreadUITests: [test]
    test:
      targets:
        - GradeThreadUITests
      gatherCoverageData: false
