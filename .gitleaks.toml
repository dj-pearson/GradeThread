# gitleaks config (US-272). Extends the built-in default ruleset and adds an
# allowlist so committed example/placeholder values don't trip the scanner.
[extend]
useDefault = true

[allowlist]
description = "Placeholders and known-public example values"
paths = [
  '''\.env\.example$''',
  '''services/edge-functions/\.env\.example$''',
  # Lockfile integrity hashes (esm.sh / npm content digests) are public content
  # addresses, not secrets — the generic-api-key rule trips on them.
  '''deno\.lock$''',
  # PEM-handling code: contains the literal -----BEGIN/END PRIVATE KEY-----
  # boundary markers used to strip a key that is read from an env var at
  # runtime (never hardcoded). Full-history scan 2026-06-02 confirmed no key
  # material here — only the boundary literals.
  '''services/edge-functions/src/lib/gsc-client\.ts$''',

  # ── US-2284, triaged 2026-08-14. The scheduled full-history scan reported 19
  # findings and had never been read: 18 of them are fixtures, and burying the
  # one real finding (extension.pem, below) under eighteen false ones is how a
  # scheduled scan becomes a check nobody opens.
  #
  # Listed FILE BY FILE rather than as a `_test\.` pattern on purpose. A blanket
  # test-path allowlist would also cover the next test somebody pastes a live
  # key into, which is a thing that happens; these are the files that trip
  # today, each checked by reading it.
  #
  # Tests whose SUBJECT is a secret-shaped string — the code under test exists
  # to scrub or verify one, so the literal has to be there:
  '''services/edge-functions/src/tests/error-redaction_test\.ts$''',
  '''services/edge-functions/src/tests/observability_test\.ts$''',
  '''ios/GradeThreadTests/TelemetryTests\.swift$''',
  '''android/app/src/test/java/com/gradethread/app/platform/telemetry/TelemetryScrubberTest\.kt$''',
  # Crypto fixtures: a fixed test key for the AES-GCM column encryption, a test
  # signing key for the Standard Webhooks verifier, a VAPID auth secret. None
  # opens anything that exists.
  '''services/edge-functions/src/tests/user-shipping-pii_test\.ts$''',
  '''services/edge-functions/src/tests/measure-card-pii_test\.ts$''',
  '''services/edge-functions/src/tests/standard-webhook_test\.ts$''',
  '''services/edge-functions/src/tests/web-push_test\.ts$''',
  # fcm_test.ts GENERATES a keypair with crypto.subtle at run time; what trips
  # the private-key rule is the -----BEGIN PRIVATE KEY----- literal in the
  # template string that wraps it.
  '''services/edge-functions/src/tests/fcm_test\.ts$''',
  # The backlog. Both hits are the words "api-keys" inside a story's prose.
  '''^prd\.json$''',
  '''^prd\.archive\.json$''',
  # Client build config. Every key in it is VITE_-prefixed, which means Vite
  # compiles it into the browser bundle — the file cannot hold a secret without
  # that secret already being public. Its own comments say so line by line:
  # Supabase URL + anon (publishable, RLS-protected) key, Stripe PUBLISHABLE
  # key, Sentry DSN, PostHog project key. The JWT and generic-api-key hits are
  # the anon key and the PostHog key.
  '''^\.env\.production$''',
]
# US-2284 — the extension signing key.
#
# extension.pem (the Chrome Web Store signing identity) was committed on
# 2026-07-13 and untracked on 2026-08-01. It is STILL IN HISTORY, so the
# scheduled full-history scan (.github/workflows/secret-scan-history.yml) will
# report it — correctly — on every run until one of two things happens:
#
#   A. the history is rewritten (BFG / git-filter-repo), which rewrites every
#      open PR and every existing clone; or
#   B. the key is treated as BURNED: rotated in the Chrome Web Store, the old
#      one revoked, and the historical copy left in place as worthless.
#
# Option B is usually right for a signing key, because rotation makes the leaked
# copy inert and a rewrite is disruptive. It is the OWNER'S CALL and it is not
# made here. Once the key is rotated, uncomment the stanza below so the
# scheduled scan goes green on a finding that no longer matters — and leave this
# comment, because an unexplained allowlist entry for a private key is exactly
# the kind of thing that gets copied.
#
# DO NOT uncomment before rotation. Silencing a live key is worse than the leak,
# because it also removes the reminder.
#
# [[rules]]
#   id = "gitleaks-private-key"
#   [rules.allowlist]
#     description = "extension.pem — leaked 2026-07-13, ROTATED <date>, old key revoked"
#     paths = ['''^extension\.pem$''']
regexes = [
  # Generic placeholder tokens used throughout the *.example files.
  '''your-[a-z-]+''',
  '''(pk|sk)_test_your-[a-z-]+''',
  '''price_…''',
  '''whsec_your-webhook-secret''',
  '''re_your-resend-api-key''',
]
