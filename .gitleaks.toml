# gitleaks config (US-272). Extends the built-in default ruleset and adds an
# allowlist so committed example/placeholder values don't trip the scanner.
[extend]
useDefault = true

[allowlist]
description = "Placeholders and known-public example values"
paths = [
  '''\.env\.example$''',
  '''services/edge-functions/\.env\.example$''',
  # Lockfile integrity hashes (esm.sh / npm content digests) are public content
  # addresses, not secrets — the generic-api-key rule trips on them.
  '''deno\.lock$''',
  # PEM-handling code: contains the literal -----BEGIN/END PRIVATE KEY-----
  # boundary markers used to strip a key that is read from an env var at
  # runtime (never hardcoded). Full-history scan 2026-06-02 confirmed no key
  # material here — only the boundary literals.
  '''services/edge-functions/src/lib/gsc-client\.ts$''',

  # ── US-2284, triaged 2026-08-14. The scheduled full-history scan reported 19
  # findings and had never been read: 18 of them are fixtures, and burying the
  # one real finding (extension.pem, below) under eighteen false ones is how a
  # scheduled scan becomes a check nobody opens.
  #
  # Listed FILE BY FILE rather than as a `_test\.` pattern on purpose. A blanket
  # test-path allowlist would also cover the next test somebody pastes a live
  # key into, which is a thing that happens; these are the files that trip
  # today, each checked by reading it.
  #
  # Tests whose SUBJECT is a secret-shaped string — the code under test exists
  # to scrub or verify one, so the literal has to be there:
  '''services/edge-functions/src/tests/error-redaction_test\.ts$''',
  '''services/edge-functions/src/tests/observability_test\.ts$''',
  '''ios/GradeThreadTests/TelemetryTests\.swift$''',
  '''android/app/src/test/java/com/gradethread/app/platform/telemetry/TelemetryScrubberTest\.kt$''',
  # Crypto fixtures: a fixed test key for the AES-GCM column encryption, a test
  # signing key for the Standard Webhooks verifier, a VAPID auth secret. None
  # opens anything that exists.
  '''services/edge-functions/src/tests/user-shipping-pii_test\.ts$''',
  '''services/edge-functions/src/tests/measure-card-pii_test\.ts$''',
  '''services/edge-functions/src/tests/standard-webhook_test\.ts$''',
  '''services/edge-functions/src/tests/web-push_test\.ts$''',
  # fcm_test.ts GENERATES a keypair with crypto.subtle at run time; what trips
  # the private-key rule is the -----BEGIN PRIVATE KEY----- literal in the
  # template string that wraps it.
  '''services/edge-functions/src/tests/fcm_test\.ts$''',
  # The backlog. Both hits are the words "api-keys" inside a story's prose.
  '''^prd\.json$''',
  '''^prd\.archive\.json$''',
  # Client build config. Every key in it is VITE_-prefixed, which means Vite
  # compiles it into the browser bundle — the file cannot hold a secret without
  # that secret already being public. Its own comments say so line by line:
  # Supabase URL + anon (publishable, RLS-protected) key, Stripe PUBLISHABLE
  # key, Sentry DSN, PostHog project key. The JWT and generic-api-key hits are
  # the anon key and the PostHog key.
  '''^\.env\.production$''',
]
# US-2284 — the extension signing key. See the allowlisted rule at the end of
# this file; the reasoning lives there, next to the entry it explains.
regexes = [
  # Generic placeholder tokens used throughout the *.example files.
  '''your-[a-z-]+''',
  '''(pk|sk)_test_your-[a-z-]+''',
  '''price_…''',
  '''whsec_your-webhook-secret''',
  '''re_your-resend-api-key''',
]

# ── US-2284 — extension.pem, allowlisted 2026-08-24 because it authorises
# nothing that exists. This is the ONE allowlist entry in this file that names a
# real private key, so the reasoning is here in full rather than by reference.
#
# WHAT HAPPENED: extension.pem was committed on 2026-07-13 (e1dbc4da), untracked
# on 2026-08-01, and is still in git history. Untracking does not un-leak it.
#
# WHY IT IS NOT ROTATED: there is nothing to rotate. The file was produced
# LOCALLY by Chrome's "Pack extension" button. It signs a self-hosted .crx and
# derives an extension id from its public key. A ZIP uploaded to the Chrome Web
# Store is signed with GOOGLE's key and given a Web Store item id, so the local
# pem never enters the publish path -- which is why the Developer Dashboard has
# no control for it. An earlier version of this comment said to rotate it in the
# dashboard, and cost the owner an evening looking for the button.
#
# WHY THE LEAK IS INERT -- the three things that would each make it serious, all
# re-checked against the tree on 2026-08-24:
#   * no "key" field in extension/, extension-condition/ or extension-unified/
#     manifest.json, so no shipping extension id derives from that keypair;
#   * no "update_url" in any of the three, so there is no self-hosted update
#     channel a .crx signed with it could be pushed through;
#   * scripts/package-extensions.mjs ships a plain .zip and never touches a pem.
# If any of those three ever stops being true, this entry stops being safe.
#
# WHY NOT REWRITE HISTORY: a BFG / git-filter-repo pass rewrites every open PR
# and invalidates every existing clone, to scrub a key that authorises nothing.
#
# AT PUBLISH TIME (US-1757): let the Web Store assign the item id and do NOT add
# a "key" field to the manifest. Adding one pins the published id to a locally
# held keypair and recreates this exposure, for real.
#
# The rule id is "private-key", which is what gitleaks' default ruleset actually
# calls it -- the stanza this replaces said "gitleaks-private-key" and would
# have matched nothing. It also sat inside the [allowlist] table, where
# uncommenting it would have swallowed the `regexes` list above.
[[rules]]
  id = "private-key"
  [rules.allowlist]
    description = "extension.pem -- local Pack-extension key, leaked 2026-07-13, signs nothing that exists (see comment above)"
    # Scoped to the ONE historical commit AND that one path, so this entry can
    # only ever cover the leak it was written for. Committing a pem again today
    # still fails the scan, which is the point -- *.pem is gitignored, and a
    # blanket path allowlist would quietly cover the next one.
    condition = "AND"
    commits = ["e1dbc4da4e6c282edad1537351a7fb348a4c2ffa"]
    paths = ['''^extension\.pem$''']
