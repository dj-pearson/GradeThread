<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F3460" />
    <link rel="apple-touch-icon" href="/logo_icon_512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlipDesk" />
    <!-- prerender:head:start — the build-time prerender (US-292,
         scripts/prerender.mjs) replaces everything between these markers with
         per-route <title>/description/canonical/OG/Twitter + JSON-LD. The
         values below are the default (SPA fallback) for non-prerendered routes. -->
    <title>GradeThread - The Standard for Clothing Condition Grading</title>
    <meta name="description" content="The trusted standard for pre-owned clothing condition grading. Get an objective 1.0–10.0 grade and a shareable certificate buyers trust — then run your whole reselling workflow with FlipDesk." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GradeThread - The Standard for Clothing Condition Grading" />
    <meta property="og:description" content="The trusted standard for pre-owned clothing condition grading. Get an objective grade and a certificate buyers trust — then run your whole reselling workflow with FlipDesk." />
    <meta property="og:site_name" content="GradeThread" />
    <meta property="og:image" content="https://gradethread.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GradeThread - The Standard for Clothing Condition Grading" />
    <meta name="twitter:description" content="The trusted standard for pre-owned clothing condition grading. Get an objective grade and a certificate buyers trust — then run your whole reselling workflow with FlipDesk." />
    <meta name="twitter:image" content="https://gradethread.com/og-image.png" />
    <!-- prerender:head:end -->

    <!-- Inter font (US-305). The non-render-blocking promotion + Google Consent
         Mode v2 bootstrap live in /head-init.js (external, same-origin) so the
         SPA can ship an ENFORCING CSP without 'unsafe-inline' in script-src
         (US-264). preconnects stay here; <noscript> covers no-JS visitors. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Head bootstrap: Consent Mode v2 defaults (denied until the cookie
         banner opts in) + non-blocking Inter font. Runs before the async
         gtag.js below so the dataLayer + consent defaults exist first. -->
    <script src="/head-init.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CMDWCFC275"></script>
  </head>
  <body>
    <div id="root"><!--prerender:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
