<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C1E36" />
    <link rel="apple-touch-icon" href="/logo_icon_512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FlipDesk" />
    <!-- prerender:head:start — the build-time prerender (US-292,
         scripts/prerender.mjs) replaces everything between these markers with
         per-route <title>/description/canonical/OG/Twitter + JSON-LD. The
         values below are the default (SPA fallback) for non-prerendered routes. -->
    <title>GradeThread - The Standard for Clothing Condition Grading</title>
    <meta name="description" content="The trusted standard for pre-owned clothing condition grading. Get an objective 1.0–10.0 grade and a shareable certificate buyers trust — then run your whole reselling workflow with FlipDesk." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GradeThread - The Standard for Clothing Condition Grading" />
    <meta property="og:description" content="The trusted standard for pre-owned clothing condition grading. Get an objective grade and a certificate buyers trust — then run your whole reselling workflow with FlipDesk." />
    <meta property="og:site_name" content="GradeThread" />
    <meta property="og:image" content="https://gradethread.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GradeThread - The Standard for Clothing Condition Grading" />
    <meta name="twitter:description" content="The trusted standard for pre-owned clothing condition grading. Get an objective grade and a certificate buyers trust — then run your whole reselling workflow with FlipDesk." />
    <meta name="twitter:image" content="https://gradethread.com/og-image.png" />
    <!-- prerender:head:end -->

    <!-- Inter font (US-305) + Consent Mode v2 + Google Analytics bootstrap.
         INLINED (was the external /head-init.js) so it costs no render-blocking
         network round trip — that request was the #1 PageSpeed mobile blocker
         (~490ms). CSP-safe via a sha256 hash in public/_headers (US-264); keep
         the script byte-identical to that hash. preconnects + <noscript> stay
         for the font; gtag.js is deferred to idle so it's off the LCP path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      (function () {
        // Google Consent Mode v2 — everything denied until the cookie banner
        // opts in (GDPR/CCPA). The banner calls gtag('consent','update',…).
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: "denied",
          wait_for_update: 500,
        });
        gtag("js", new Date());
        gtag("config", "G-CMDWCFC275");

        // Inter and Outfit fonts, non-render-blocking (display=swap → the hero LCP paints
        // in the system fallback and swaps to Inter/Outfit on load).
        var font = document.createElement("link");
        font.rel = "stylesheet";
        font.href =
          "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap";
        document.head.appendChild(font);

        // gtag.js (~154 KiB) off the critical path: load it once the page is
        // idle so it never competes with LCP. The consent defaults + config
        // above are already queued on the dataLayer, so GA replays them in
        // order the moment it arrives.
        function loadGtag() {
          if (window.__gtagLoaded) return;
          window.__gtagLoaded = true;
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-CMDWCFC275";
          document.head.appendChild(s);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadGtag, { timeout: 4000 });
        } else {
          setTimeout(loadGtag, 2500);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--prerender:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
