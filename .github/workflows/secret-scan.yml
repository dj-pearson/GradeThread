name: Secret scan

# Blocks any secret from landing on main. (US-272)
# The broader dependency/SAST pipeline (npm audit, CodeQL, Deno) is US-273.
#
# ⚠ RUNS THE GITLEAKS BINARY, NOT gitleaks/gitleaks-action. The action performs a
# licence check before it scans anything, and that check calls the GitHub API for
# the repository owner. When that call fails — which it does intermittently — the
# action does not skip the check, it FAILS CLOSED into licence enforcement:
#
#   ##[warning] Get user [dj-pearson] failed with error [HttpError: invalid json
#   response body ... Unexpected end of JSON input]. License key validation will
#   be enforced 🤷
#   ##[error] 🛑 missing gitleaks license.
#
# Observed 2026-08-17 on run 32052310233; the very next push scanned clean. So the
# lane went red for a third-party billing lookup rather than for anything in the
# diff — and a security gate that cries wolf is one somebody starts re-running
# until it passes, which is the failure mode that matters here.
#
# secret-scan-history.yml already reached the same conclusion for the weekly
# sweep ("deliberately the binary rather than gitleaks-action"). This brings the
# per-push gate onto the same engine as that job AND as .githooks/pre-commit, so
# all three agree by construction rather than by resemblance.
#
# ⚠ SCOPE IS THE PUSHED RANGE, NOT THE WHOLE HISTORY, and the distinction is load
# bearing. Per-push asks "is this change clean?"; the weekly job asks "is the
# repository clean?" — and the weekly job is the only one that can answer the
# second. Scanning full history here would re-answer a question already asked
# once a week, on every push, for no new information.
#
# (Until 2026-08-24 this comment said the weekly answer was NO, because
# extension.pem sat in history behind US-2284. It is now allowlisted in
# .gitleaks.toml — scoped to that one commit and path, with the reasoning in
# the comment above the stanza — so both jobs are green and a NEW pem still
# fails both.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in ANY commit of the range is
          # caught, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned, and matched to the version the local pre-commit hook runs.
          # An unpinned "latest" makes this gate's verdict change without a
          # commit, which is the same class of problem as the licence check.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the pushed range
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Resolve the range this event introduced. Each arm is guarded because
          # an unresolvable range must not silently become "scan nothing" — that
          # would be a green gate over an unexamined diff.
          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${BEFORE:-}" ] \
            && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${GITHUB_SHA}"
          else
            # First push to a branch, a force-push, or a rewritten base: there is
            # no honest range. Fall back to the tip commit rather than to nothing.
            echo "::notice::no usable range (before='${BEFORE:-unset}') — scanning the tip commit only"
            RANGE="${GITHUB_SHA}~1..${GITHUB_SHA}"
          fi
          echo "Scanning ${RANGE}"

          # --redact keeps a finding's value out of a public log: the point is
          # that a leaked secret must not leak again in the evidence that it
          # leaked. --exit-code 1 is explicit so a future default change cannot
          # quietly turn findings into a pass.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${RANGE}" \
            --redact \
            --verbose \
            --exit-code 1
