name: Secret scan

# Blocks any secret from landing on main. (US-272)
# The broader dependency/SAST pipeline (npm audit, CodeQL, Deno) is US-273.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in any commit on the PR is caught.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required since gitleaks-action v2 for scanning pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
