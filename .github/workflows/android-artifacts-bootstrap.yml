# Android artifacts bootstrap — TEMPORARY, delete once it has run (US-2502).
#
# US-2502 turned lint into a gate and pointed it at `android/app/lint-baseline.xml`.
# That file is a BUILD OUTPUT, not source, and it was never generated: the
# session that wrote the gate had no Android SDK (android/HANDOFF-US-2502.md
# says so in the first paragraph). So `:app:lintDebug` writes a fresh baseline
# on every CI run and then aborts on purpose — "Aborting build since new
# baseline file was created" — which is what has been failing Android CI since
# 2026-08-13.
#
# A runner has the SDK. This job generates the baseline there and commits it
# back to the branch, which is the only path available from a cloud session
# (dl.google.com is blocked by the sandbox network policy, so no Android build
# resolves locally, and the artifact download host is blocked too).
#
# Both variants are baselined and MERGED, because one file serves both:
# `checkReleaseBuilds = true` means `lintRelease` reads the same baseline, and a
# baseline written by one variant does not contain the other's findings. An
# entry that no longer applies is only an informational note from lint; a
# missing entry fails the build.
#
# It also prints the measured line coverage, because `koverLineFloor` in
# app/build.gradle.kts is still the PROVISIONAL 40 and the suite has never been
# measured.
#
# DELETE THIS FILE once the baseline is committed. It exists to produce one
# artifact once, not to become a second way to run lint.
name: Android artifacts bootstrap

on:
  push:
    branches:
      - "claude/github-actions-green-**"
    paths:
      - ".github/workflows/android-artifacts-bootstrap.yml"
  workflow_dispatch:

concurrency:
  group: android-bootstrap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  baseline:
    name: Generate lint baseline, commit it
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Spotless ratchets against origin/main; the lint tasks pull in the
          # same build config, so give them the same history Android CI gets.
          fetch-depth: 0

      - name: Make origin/main resolvable
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Already have a baseline?
        id: check
        run: |
          if [ -f android/app/lint-baseline.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "android/app/lint-baseline.xml exists — nothing to generate."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.present == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        if: steps.check.outputs.present == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Baseline the debug variant
        if: steps.check.outputs.present == 'false'
        working-directory: android
        run: |
          ./gradlew :app:updateLintBaselineDebug --stacktrace
          cp app/lint-baseline.xml "$RUNNER_TEMP/baseline-debug.xml"

      - name: Baseline the release variant
        if: steps.check.outputs.present == 'false'
        working-directory: android
        run: |
          ./gradlew :app:updateLintBaselineRelease --stacktrace
          cp app/lint-baseline.xml "$RUNNER_TEMP/baseline-release.xml"

      # One file, two variants. Union of the <issue> elements, keyed on the
      # issue id plus every location it names, so a finding that only the
      # release variant sees is still suppressed when lintDebug runs and vice
      # versa. Written with the stdlib because the runner has no lxml.
      - name: Merge the two baselines
        if: steps.check.outputs.present == 'false'
        run: |
          python3 - "$RUNNER_TEMP/baseline-debug.xml" "$RUNNER_TEMP/baseline-release.xml" android/app/lint-baseline.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          debug_path, release_path, out_path = sys.argv[1:4]

          def key(issue):
              locs = [
                  (loc.get("file"), loc.get("line"), loc.get("column"), loc.get("message"))
                  for loc in issue.findall("location")
              ]
              return (issue.get("id"), issue.get("message"), tuple(locs))

          merged = ET.parse(debug_path)
          root = merged.getroot()
          seen = {key(i) for i in root.findall("issue")}
          added = 0
          for issue in ET.parse(release_path).getroot().findall("issue"):
              if key(issue) not in seen:
                  seen.add(key(issue))
                  root.append(issue)
                  added += 1
          ET.indent(merged, space="    ")
          merged.write(out_path, encoding="UTF-8", xml_declaration=True)
          print(f"merged baseline: {len(seen)} issue(s), {added} release-only")
          PY

      - name: Both lint variants pass with it
        if: steps.check.outputs.present == 'false'
        working-directory: android
        run: |
          ./gradlew :app:lintDebug --stacktrace
          ./gradlew :app:lintRelease --stacktrace

      # koverLineFloor is 40 and PROVISIONAL. This prints what the suite
      # actually reaches so the floor can be set to the measured number.
      - name: Measured line coverage
        if: steps.check.outputs.present == 'false'
        continue-on-error: true
        working-directory: android
        run: ./gradlew :app:koverLogDebug --stacktrace

      - name: Commit the baseline
        if: steps.check.outputs.present == 'false'
        run: |
          if git diff --quiet -- android/app/lint-baseline.xml && \
             [ -z "$(git status --porcelain -- android/app/lint-baseline.xml)" ]; then
            echo "no baseline change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/lint-baseline.xml
          # [skip ci] so this commit does not re-trigger the bootstrap.
          git commit -m "chore(android): record the lint baseline on a runner (US-2502) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
