name: Android Release

# US-1392. Fires when:
#   - a tag matching android-v* is pushed (an explicit, deliberate release)
#   - someone clicks "Run workflow" and picks a track
#
# Deliberately NOT on every push to main. The iOS lane can auto-cut a
# TestFlight build because TestFlight is a tester surface with no review queue;
# Play's internal track shares a version-code space with production, so an
# automatic upload on every merge burns codes and fills the Console with builds
# nobody asked for.

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        type: choice
        options: [internal, beta, production]
        default: internal
      dry_run:
        description: "Build the AAB but skip the upload"
        type: boolean
        default: false

concurrency:
  # Serialize: two uploads racing for the same version code both fail, and the
  # second one fails in a way that reads like a credentials problem.
  group: android-release
  cancel-in-progress: false

# US-522: least privilege. This lane reads the repo and authenticates to Play
# with a job secret; it never writes back.
permissions:
  contents: read

jobs:
  # The two things no JVM test can answer: does the app survive
  # Application.onCreate with the real Hilt graph, and do the Room migrations
  # run against a real SQLite. android-ci.yml runs this same suite on every PR
  # and lets it fail without blocking, because a 45-minute emulator job that
  # flakes should not stop a one-line change from merging. A RELEASE is the
  # other case entirely: shipping a bundle that crashes on launch, or that
  # cannot open an existing seller's database, is the failure this whole lane
  # exists to prevent, and it is worth waiting for. Blocking here and advisory
  # there is the same suite read at two different stakes.
  instrumented:
    name: App launches and migrations run (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required, not optional: `release` needs this job, so without the key this
    # gate can never go green and no release can ever ship. The placeholder is
    # enough - these tests exercise launch and migrations, never the network -
    # and it keeps real credentials out of an emulator job.
    env:
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        # Without it the emulator falls back to software rendering and takes
        # long enough to hit the job timeout.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload the instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-instrumented-report
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: bundleRelease + Play upload
    runs-on: ubuntu-latest
    needs: instrumented
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Import release secrets from Infisical
        # Same pattern as ios-release.yml: only the three INFISICAL_* values
        # live in GitHub Actions secrets; the keystore and the Play service
        # account come from self-hosted Infisical into $GITHUB_ENV.
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: grade-thread
          env-slug: prod
          secret-path: /

      - name: Check the secrets that must be present
        # Named up front. Without this, a missing keystore surfaces as an
        # UNSIGNED bundle that Play rejects at the end of a 20-minute job with
        # a message that does not mention signing.
        #
        # US-2892: the first five are about SIGNING and UPLOADING. None of them
        # is about whether the app WORKS, and for a while that was the whole
        # list. The three below are the ones AppConfig.validateAtStartup()
        # throws on: a release built without SUPABASE_ANON_KEY is signed,
        # versioned, under budget, and crashes on launch for every user, with
        # every gate in this lane green. `secret()` defaults it to an empty
        # string, so nothing upstream complains either.
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?missing from env (check Infisical prod /)}"
          : "${ANDROID_KEYSTORE_PASSWORD:?missing from env (check Infisical prod /)}"
          : "${ANDROID_KEY_ALIAS:?missing from env (check Infisical prod /)}"
          : "${ANDROID_KEY_PASSWORD:?missing from env (check Infisical prod /)}"
          : "${PLAY_SERVICE_ACCOUNT_JSON:?missing from env (check Infisical prod /)}"
          : "${SUPABASE_URL:?missing from env -- the app cannot reach Supabase (check Infisical prod /)}"
          : "${SUPABASE_ANON_KEY:?missing from env -- AppConfig throws at startup, so the app CRASHES ON LAUNCH (check Infisical prod /)}"
          : "${EDGE_API_URL:?missing from env -- no /api call works: grading, payments, eBay (check Infisical prod /)}"
          echo "all release secrets present"

      - name: Warn about the optional config that ships features DEAD
        # Deliberately not a failure: a build without these is a working app
        # with fewer features, and AppConfig disables each one cleanly. It is
        # still not something to discover from a user. Absent FIREBASE_* means
        # no push at all, and the first symptom is sellers not being told they
        # sold something.
        run: |
          set +u
          missing=""
          for v in SENTRY_DSN POSTHOG_API_KEY TURNSTILE_SITE_KEY \
                   FIREBASE_PROJECT_ID FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_SENDER_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Release config absent:$missing -- see the job summary."
            {
              echo "### Android release config"
              echo
              echo "These were absent, so the features they gate ship disabled:"
              for v in $missing; do echo "- \`$v\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "all optional release config present"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # US-2892: pinned, not inherited. The runner ships a Node, but which one
      # is the image's business and it changes without notice -- and this lane
      # now runs a gate on it. Same version as android-ci.yml.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # No bundler-cache: that needs a committed Gemfile.lock, and this
          # repo does not commit one for the iOS lane either. `bundle install`
          # runs explicitly below, the same way ios-release.yml does it.
          bundler-cache: false

      # Cheap, and it is the one check that can fail for a reason unrelated to
      # the release itself.
      - name: No ungated logging
        run: python3 scripts/no-ungated-log.py

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Derive the marketing version
        # A tag release takes it from the tag (android-v1.2.0 → 1.2.0); a
        # dispatch leaves it blank so the project default stands. Done in shell
        # because Actions expressions have no substring function — writing one
        # in the expression silently evaluates to empty, which would ship every
        # tagged release under the default version.
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_NAME=" >> "$GITHUB_ENV"
          fi

      - name: Build signed AAB
        run: ./gradlew bundleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
          # The run number, so every upload is strictly higher than the last.
          # Play rejects a re-used code outright.
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Confirm the bundle is signed
        # `bundleRelease` succeeds with NO signing config, producing an unsigned
        # AAB — that is deliberate for PR builds (see app/build.gradle.kts), but
        # a release must never upload one. Play would reject it, minutes later,
        # with an error that does not name signing.
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          if ! unzip -l "$AAB" | grep -qiE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "::error::The AAB is UNSIGNED — the keystore did not resolve." >&2
            exit 1
          fi
          echo "signed"

      - name: Confirm the bundle carries its configuration
        # US-2892: the twin of the signing check above, and it exists for the
        # same reason -- a bundle that is wrong in a way Play accepts is worse
        # than one Play rejects, because the failure lands on users instead of
        # on this job.
        #
        # The env check earlier proves the values were PRESENT. This proves they
        # reached the BINARY, which is a different claim: a renamed
        # buildConfigField, a misspelled `secret()` lookup, a variant that does
        # not inherit the field, or a stale Gradle cache all pass the first and
        # fail this. It reads the dex the device will actually run.
        #
        # Self-test first, so a check that has quietly stopped checking fails
        # here rather than passing everything forever. No secret is printed:
        # the script reports names and present/absent only.
        run: |
          set -euo pipefail
          node scripts/check-release-config.mjs --self-test
          node scripts/check-release-config.mjs app/build/outputs/bundle/release/app-release.aab

      - name: 16 KB page-size compatibility
        # US-2893: the same check CI runs on every push, repeated against the
        # artifact that actually uploads. Cheap, and the last moment before a
        # bundle that cannot load on a 16 KB device becomes a download people
        # have already taken.
        run: |
          node scripts/check-16kb-alignment.mjs --self-test
          node scripts/check-16kb-alignment.mjs app/build/outputs/bundle/release/app-release.aab

      # US-2150: the same per-ABI budget the CI lane enforces, run against the
      # artifact that actually ships. A release is the last moment the number
      # is still cheap to look at — after the upload it is a download people
      # have already paid for.
      - name: Per-ABI download size
        run: |
          python3 scripts/abi-size-report.py --self-test
          python3 scripts/abi-size-report.py

      - name: Upload to Play
        if: ${{ !inputs.dry_run }}
        run: |
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3
          bundle exec fastlane ${{ inputs.track || 'internal' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload the AAB as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload the R8 mapping
        # Without it, every Play Console crash report for this build is
        # unreadable — and the mapping only exists on the runner.
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      # US-2502: the same mapping, sent to Sentry.
      #
      # The artifact above makes a stack trace decodable BY HAND, 90 days, by
      # someone who knows to download it. Sentry needs it to deobfuscate the
      # crashes it is already collecting through SENTRY_DSN — without the upload
      # every Android crash in Sentry is a wall of `a.b.c(SourceFile:1)`, which
      # is indistinguishable from having no crash reporting at all.
      #
      # Skipped, not failed, when the token is absent: this lane must stay
      # runnable before the Sentry project has an auth token issued.
      - name: Upload the mapping to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT_ANDROID != '' }}
        run: |
          set -euo pipefail
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          test -f "$MAPPING"
          npm install -g @sentry/cli@2
          # The UUID has to match what the app reports. Sentry derives it from
          # the file, so upload-proguard is the whole handshake.
          sentry-cli upload-proguard \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_ANDROID" \
            --version "${ANDROID_VERSION_NAME:-0.1.0}" \
            "$MAPPING"
        env:
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT_ANDROID: ${{ env.SENTRY_PROJECT_ANDROID }}
          SENTRY_URL: ${{ env.SENTRY_URL }}
