name: iOS UI smoke

# Backend-independent XCUITest launch smoke (GradeThreadUITests/SmokeUITests).
# Deliberately a SEPARATE, non-required workflow so it doesn't slow or block the
# fast unit-test gate in ios-ci.yml. Runs only the smoke test via -only-testing,
# so the fastlane snapshot capture in ScreenshotUITests is never triggered here.
# Promote to a required check once it's proven green on macOS runners.

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-smoke.yml"
  workflow_dispatch:

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: UI launch smoke
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned to match ios-ci.yml (XcodeGen writes objectVersion 77, needs >=16).
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: UI launch smoke
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -scheme GradeThreadScreenshots \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:GradeThreadUITests/SmokeUITests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-results
          path: |
            ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
