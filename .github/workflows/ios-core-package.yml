name: Core package (Linux swift test)

# Builds + unit-tests the platform-agnostic GradeThreadCore SwiftPM package on
# LINUX — no Mac, no simulator, no Xcode. This is the "run it, don't just reason
# about it" gate for the pure logic extracted out of the iOS app (merge policy
# today; money/decode logic as it migrates). The macOS ios-ci.yml still owns the
# full app build + UI tests; this runs in seconds and catches pure-logic
# regressions on every push.
#
# Runs in the official Swift container so there's no toolchain-install step.

on:
  push:
    paths:
      - "ios/Packages/GradeThreadCore/**"
      # US-1995 AC3: TitleSyncFixtureTests asserts the Swift title-sync port
      # against the SHARED fixture, which lives in the web tree because the
      # vitest and deno suites assert it too. Without this path the fixture could
      # gain a case that the Swift port fails and this lane would not run, so the
      # drift guard would be green for the wrong reason.
      - "src/test/fixtures/title-sync-cases.json"
      - ".github/workflows/ios-core-package.yml"
  pull_request:
    paths:
      - "ios/Packages/GradeThreadCore/**"
      - "src/test/fixtures/title-sync-cases.json"
      - ".github/workflows/ios-core-package.yml"

permissions:
  contents: read

concurrency:
  group: core-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    # Official Swift toolchain image — no install step. The manifest is
    # swift-tools-version:5.9 (portable), so any 5.9+ toolchain builds it.
    container: swift:5.10
    defaults:
      run:
        working-directory: ios/Packages/GradeThreadCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
