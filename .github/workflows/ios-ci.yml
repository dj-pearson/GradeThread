name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

# US-522: least privilege — this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned because Apple ships new Xcodes on macos-14 frequently and an
        # unannounced bump breaks the build cache. Update intentionally.
        # Must be >= 16: XcodeGen 2.45+ writes the project at objectVersion 77,
        # which Xcode 15.4 refuses to open ("future Xcode project file format").
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint — no ungated print() in app sources (US-698)
        run: python3 ios/Scripts/no-ungated-print.py

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check ATS posture + https base URLs (US-1008)
        # Run AFTER xcodegen so the regenerated Info.plist is what we scan. Fails
        # if the merged Release Info.plist relaxes App Transport Security or if an
        # xcconfig configures a non-https SUPABASE_URL / EDGE_API_URL.
        run: python3 ios/Scripts/check-ats.py

      - name: Build + test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -scheme GradeThread \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify --renderer github-actions

      - name: Build app-extension targets (US-1224)
        working-directory: ios
        # The Widget + Share extensions build as embedded deps of the GradeThread
        # app scheme above, but build them EXPLICITLY here too so a break in an
        # extension target surfaces as its own clearly-named failure (and is caught
        # even if the app scheme stops embedding them). Smoke build only — no test
        # bundle ships for an appex.
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -target ShareExtension \
            -target GradeThreadWidget \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions

      - name: Lint — String Catalog + no NEW bare UI strings in migrated dirs (US-1155)
        # Localization guard (US-1224 origin, widened in US-1155): validates the
        # Localizable.xcstrings String Catalog is present + well-formed, and flags
        # NEW bare Text("…")/Label("…") literals in the migrated directories
        # (Prospect/Vision/Speech + Settings). Scoped + baselined so it doesn't
        # flag the remaining ~670 app-wide strings. See ios/Scripts/no-bare-strings.py.
        run: python3 ios/Scripts/no-bare-strings.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # US-1153: critical-flow UI tests (sign-in, paywall purchase via the
  # GradeThread.storekit configuration, capture→grade). A SEPARATE job from the
  # fast unit lane and intentionally NON-BLOCKING (`continue-on-error: true`)
  # until it has proven stable across runner/simulator churn — promote it to a
  # required check once green is reliable. Runs the dedicated GradeThreadUITests
  # scheme (skips the fastlane-only ScreenshotUITests via the test plan in
  # project.yml). The hermetic `-uitest*` launch arguments keep it offline.
  ui-test:
    name: UI tests (critical flows)
    runs-on: macos-14
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: UI test — critical flows
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -scheme GradeThreadUITests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:GradeThreadUITests/CriticalFlowUITests \
            clean test | xcbeautify --renderer github-actions

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
