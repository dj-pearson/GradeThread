name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

# US-522: least privilege — this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: Build + test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pinned because Apple ships new Xcodes on macos-14 frequently and an
        # unannounced bump breaks the build cache. Update intentionally.
        # Must be >= 16: XcodeGen 2.45+ writes the project at objectVersion 77,
        # which Xcode 15.4 refuses to open ("future Xcode project file format").
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint — no ungated print() in app sources (US-698)
        run: python3 ios/Scripts/no-ungated-print.py

      - name: Lint — no default URLSession=.shared in services (US-1407)
        run: python3 ios/Scripts/no-default-shared-session.py

      - name: Lint — one .sheet modifier per view
        # Two `.sheet` modifiers on one view compete for its single presentation
        # slot; the loser opens and closes in the same frame. That is what broke
        # "Prospect an item" and "What's it worth?", and it is invisible in review.
        run: python3 ios/Scripts/check-chained-sheets.py

      - name: Lint — AI-inference routes use the long-idle session
        # These routes stream nothing until the model finishes, so the 20s-idle
        # session kills a request the server completed AND billed. ScoutAI and
        # Item Prospecting sat on the short session and failed every time.
        run: python3 ios/Scripts/check-ai-session.py

      - name: Lint — every Swift help slug is in the shared registry
        # A slug is a string that reaches the server. The enum case is
        # compiler-checked; the string it resolves to is not. A typo does
        # not crash and does not log -- the sheet opens, the server answers
        # 404, the sheet closes, and the help button is simply dead.
        run: python3 ios/Scripts/check-help-slugs.py

      - name: Lint — no trailing comma in a parameter list
        # Swift allows it from 6.1; this target is SWIFT_VERSION 5.9, where it is
        # a PARSE error the compiler reports as a bare "Unexpected ',' separator"
        # naming no file and no line. Cheap to write, expensive to find.
        run: python3 ios/Scripts/no-trailing-comma.py

      - name: Lint — no raw JPEG encode outside PhotoCompressor (US-2083)
        run: python3 ios/Scripts/no-raw-jpeg-encode.py

      - name: Lint — String Catalog + no NEW bare UI strings in migrated dirs (US-1155)
        # Localization guard (US-1224 origin, widened in US-1155): validates the
        # Localizable.xcstrings String Catalog is present + well-formed, and flags
        # NEW bare Text("…")/Label("…") literals in the migrated directories
        # (Prospect/Vision/Speech + Settings). Scoped + baselined so it doesn't
        # flag the remaining ~670 app-wide strings. See ios/Scripts/no-bare-strings.py.
        #
        # US-2499: MOVED here, ahead of xcodegen and the simulator build. It used
        # to run after them, so US-1866 shipping 22 unbaselined strings failed at
        # the slowest possible point and stayed red on main for five days before
        # anyone read past the first line. It needs no toolchain and no project,
        # so there was never a reason for it to wait behind a build.
        run: python3 ios/Scripts/no-bare-strings.py

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check ATS posture + https base URLs (US-1008)
        # Run AFTER xcodegen so the regenerated Info.plist is what we scan. Fails
        # if the merged Release Info.plist relaxes App Transport Security or if an
        # xcconfig configures a non-https SUPABASE_URL / EDGE_API_URL.
        run: python3 ios/Scripts/check-ats.py

      - name: Verify SPM lockfile pinned (US-1523)
        working-directory: ios
        # Resolves the package graph and fails if the lockfile is missing or if
        # supabase-swift drifted from the EXACT version pinned in project.yml. The
        # exact pin makes resolution deterministic (a committed lockfile's job) so
        # an unattended minor bump can't silently change auth/session behavior.
        run: |
          set -euo pipefail
          xcodebuild -project GradeThread.xcodeproj -scheme GradeThread -resolvePackageDependencies -quiet
          RESOLVED="GradeThread.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ ! -f "$RESOLVED" ]; then
            echo "::error::Package.resolved missing after dependency resolution."
            exit 1
          fi
          VER="$(jq -r '.pins[]? | select(.identity=="supabase-swift") | .state.version' "$RESOLVED")"
          echo "supabase-swift resolved to: ${VER:-<none>}"
          if [ "$VER" != "2.49.0" ]; then
            echo "::error::supabase-swift drifted from the pinned exact version 2.49.0 (got '${VER:-none}'). Update project.yml + this guard together."
            exit 1
          fi

      - name: Build + test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -scheme GradeThread \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify --renderer github-actions

      - name: Build app-extension targets (US-1224)
        working-directory: ios
        # The Widget + Share extensions build as embedded deps of the GradeThread
        # app scheme above, but build them EXPLICITLY here too so a break in an
        # extension target surfaces as its own clearly-named failure (and is caught
        # even if the app scheme stops embedding them). Smoke build only — no test
        # bundle ships for an appex.
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -target ShareExtension \
            -target GradeThreadWidget \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # US-1153: critical-flow UI tests (sign-in, paywall purchase via the
  # GradeThread.storekit configuration, capture→grade). A SEPARATE job from the
  # fast unit lane so a slow simulator run does not hold up the quick feedback —
  # but BLOCKING since US-2344, see the note on the job below. Runs the dedicated
  # GradeThreadUITests scheme (skips the fastlane-only ScreenshotUITests via the
  # test plan in project.yml). The hermetic `-uitest*` launch arguments keep it
  # offline.
  ui-test:
    name: UI tests (critical flows)
    runs-on: macos-14
    timeout-minutes: 40
    # US-2344 AC1/AC2: BLOCKING, decided on evidence rather than nerve.
    #
    # `continue-on-error: true` meant this job could never fail anything, so the
    # comment above about promoting it "once green is reliable" had no trigger —
    # nothing was measuring reliability. The measurement, taken 2026-08-03 over
    # the last 14 runs on main: 11 success, 2 failure, 1 cancelled. Both failures
    # were on runs where the BLOCKING "Build + test" job failed too, so this job
    # has never gone red on its own. It is not flaky; it was just non-blocking.
    #
    # That also settles AC2: there is no flaky case to quarantine, because there
    # has been no independent failure to attribute to one.
    #
    # AC4 is why this matters more than it looks — iOS cannot be built or tested
    # on the Windows dev host, so this runner IS the safety net. A safety net
    # wired to ignore its own result is a decoration.
    #
    # If it does turn flaky: quarantine the offending CASE, do not restore
    # continue-on-error on the whole job. That is what put it here.

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: UI test — critical flows
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project GradeThread.xcodeproj \
            -scheme GradeThreadUITests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:GradeThreadUITests/CriticalFlowUITests \
            clean test | xcbeautify --renderer github-actions

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
