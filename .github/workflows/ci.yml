name: CI

# Frontend app gate: lint + type-check + unit tests (with coverage thresholds) +
# production build must pass before a change can merge to main. The edge service
# is covered separately by the deno-check job in security.yml; dependency/secret
# scanning live in security.yml and secret-scan.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check, test & build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b
      # US-510 / US-519: run the Vitest suite with coverage thresholds. Fails the
      # build on any test failure OR if coverage drops below the configured floor
      # (vitest.config.ts). Runs alongside lint/type-check so all gates report
      # together. NOTE: make this a REQUIRED status check once branch protection
      # on `main` is (re)enabled — see US-522.
      - name: Test (with coverage)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # US-511: build the SPA, then run Playwright against `vite preview` of the
      # built artifact. Supabase/Stripe are mocked per-test (page.route), so no
      # live backend / secrets are needed — it runs on an ephemeral runner.
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
