name: CI

# Frontend app gate: lint + type-check + unit tests (with coverage thresholds) +
# production build must pass before a change can merge to main. The edge service
# is covered separately by the deno-check job in security.yml; dependency/secret
# scanning live in security.yml and secret-scan.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI builds the SPA without live backend secrets — Supabase/Stripe are mocked
# per-test and the prerender only renders static HTML. But the Supabase client
# (src/lib/supabase.ts) and edge-api (src/lib/edge-api.ts) throw at MODULE LOAD
# when these are unset, and a prerendered marketing route (/verify) now imports
# the Supabase client transitively (verify.tsx → edge-fetch → supabase), so
# `npm run build` dies during prerender without them. These are public,
# non-secret config values (the anon key here is a throwaway placeholder); a
# `api.`-prefixed URL also satisfies edge-api's derivation. Nothing in CI
# actually reaches the backend.
#
# US-2375: these three lines are NOT the source of truth — scripts/lib/ci-env.ts
# is, and vitest.config.ts injects the same object so a local `npm run verify`
# runs under identical config. Change a value there and here together;
# src/test/ci-env-parity.test.ts fails the run if they drift.
env:
  VITE_SUPABASE_URL: https://api.gradethread.com
  VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  VITE_EDGE_API_URL: https://functions.gradethread.com

jobs:
  build:
    name: Lint, type-check, test & build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # US-2044: the vault drift guard compares each note's `reviewed` date
          # against the last commit date of the files it documents, so it needs
          # real per-file history. The default fetch-depth of 1 would give every
          # path the same commit date.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # US-2346 AC4, CI half. The pre-push hook has run this since 2026-08-02 and
      # a held migration STILL reached origin on 2026-08-03 — the hook lives on
      # the machine that pushes, so `--no-verify`, a different clone, or a
      # concurrent agent all walk straight past it. This is the copy that cannot
      # be skipped. It needs only the checkout, so it runs before the long lanes:
      # a leak should be reported in seconds, not after twenty minutes of tests.
      - name: Held-migration gate
        run: node scripts/held-migration-gate.mjs --ci
      - run: npm ci
      # The scripts test lane below shells out to "deno run scripts/*.ts" --
      # the operator scripts are Deno, and this job never had it installed. Those
      # tests failed with "deno: not found" and took the whole lane down with
      # them, which is why CI has been red on main independently of any change.
      #
      # Installing it rather than skipping them: a guard that only runs on a
      # developer laptop is not a guard. Version pinned to match security.yml and
      # money-cert-integration.yml, so one Deno behaviour change cannot pass one
      # lane and fail another.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.0"
      # US-1998: every gate below carries `if: !cancelled()` so a failure in one
      # does NOT skip the rest. Previously `npm run lint` was the first step, so
      # three no-useless-escape errors on main (2026-07-17) meant CI never
      # reached type-check, tests, coverage, build or the bundle guard — the
      # frontend went unverified for a day while the run merely looked "red for
      # lint". The job still FAILS if any gate fails; you just now learn about
      # all of them in one run instead of peeling them off one push at a time.
      # US-2044: knowledge-vault integrity. --strict makes drift on a
      # `type: contract` note an error (a stale contract gets read as
      # authoritative and then implemented); other types stay warnings.
      # Needs the full history fetched above — on a shallow clone `git log -1`
      # returns the same commit for every path, so the script detects that and
      # skips drift rather than reporting every note as drifted.
      # US-2499 AC4: the iOS source guards, on the FAST runner.
      #
      # All six are pure Python text scans - no Xcode, no simulator, no project.
      # They already moved ahead of the build INSIDE ios-ci.yml, which fixed the
      # worst of it, but that whole workflow waits on a macOS runner: the slowest
      # to schedule and the most expensive minute in the fleet. A bare string or
      # an ungated print would sit unreported until one was free.
      #
      # Running the same lane here reports it in about a minute, on the runner
      # that was already going to start. This does NOT replace the macOS copy -
      # ios-ci.yml still runs them, and src/test/ios-guard-lane.test.ts fails if
      # the two lists ever diverge - it just gets the answer back first.
      - name: iOS source guards
        if: ${{ !cancelled() }}
        # `python3 --version` first, deliberately. The lane SKIPS rather than
        # fails when no interpreter is found (scripts/verify.mjs, so a Windows
        # box without Python still gets a useful run) - and a skip on CI is a
        # green tick for a guard that never executed, which is the exact failure
        # this repo keeps re-learning. If the runner image ever drops python3,
        # this step goes red instead of quietly passing.
        run: |
          python3 --version
          node scripts/verify.mjs --ios
      - name: Vault lint
        if: ${{ !cancelled() }}
        run: node scripts/vault-lint.mjs --strict
      - name: Vault index up to date
        if: ${{ !cancelled() }}
        run: node scripts/vault-index.mjs --check
      - name: Vendor skill mirrors in sync
        if: ${{ !cancelled() }}
        run: node scripts/skills-sync.mjs
      - name: Shipped runbook copies vs vault
        if: ${{ !cancelled() }}
        run: node scripts/runbook-sync.mjs
      - name: Env reference vs code
        if: ${{ !cancelled() }}
        run: node scripts/check-env-reference.mjs
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Type-check
        if: ${{ !cancelled() }}
        run: npx tsc -b
      # US-2038: BUILD BEFORE TEST — deliberately, and this ordering is load-bearing.
      #
      # Three suites gate themselves on `existsSync(dist/index.html)` and skip
      # when it is absent: prerender.test.ts, crawl-parity.test.ts and
      # responsive-images.test.ts. `dist/` is gitignored, so on a fresh runner it
      # did not exist when tests ran — and CI used to run Test BEFORE Build.
      # Result: 17 SEO / hydration-parity tests silently skipped on every CI run
      # since they were written. They never once fired. (prerender.test.ts's own
      # comment says "CI runs them after `npm run build`" — it did not.)
      #
      # Safe to reorder because of the `if: !cancelled()` rule above: a failing
      # build no longer prevents the test step from running, so moving Build
      # earlier does not hide test results.
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
      # US-510 / US-519: run the Vitest suite with coverage thresholds. Fails the
      # build on any test failure OR if coverage drops below the configured floor
      # (vitest.config.ts). Runs after Build so the dist-gated suites above
      # actually execute. NOTE: make this a REQUIRED status check once branch
      # protection on `main` is (re)enabled — see US-522.
      - name: Test (with coverage)
        if: ${{ !cancelled() }}
        run: npm run test:coverage
      # The scripts/ suite (prd-lint, prd-digest, vault tooling, doc-refs,
      # submit-indexnow, …) runs under its OWN vitest config: vitest.config.ts
      # includes only `src/**`, so `npm run test:coverage` never saw these ~190
      # tests. They ran solely via `npm run verify`, i.e. the local pre-push hook
      # — which any `--no-verify` push, or any change landing without that hook,
      # skips entirely.
      #
      # NOT hypothetical. scripts/prd-lint.test.mjs went red on 2026-07-18 when
      # the learnings file moved into the vault and the lint message followed but
      # the test's assertion did not. It stayed red across 15 subsequent commits
      # to scripts/ and was found by hand, because nothing in CI ever ran it.
      # That is the US-2038 defect class — a suite that reads as coverage while
      # never executing.
      - name: Test (scripts)
        if: ${{ !cancelled() }}
        run: npm run test:scripts
      # Same gap, same cause: these are `npm run verify` lanes that CI never
      # ran, so the local pre-push hook was STRICTER than the pipeline it claims
      # to mirror (CLAUDE.md calls verify "CI parity"). Cheap, and each can fail
      # on a real regression:
      #   • extension tests — 15 zero-dep node suites over the three MV3
      #     extensions. Includes the legacy⇄unified selector-parity guard and the
      #     Firefox version-floor guard, both of which exist to catch a defect
      #     that already shipped once. Neither ran in CI until now, which meant
      #     two guards written against real incidents could not fail the build.
      #   • prd-lint — bad nextId, duplicate ids, dependency cycles, and stale
      #     held-migration claims that tell a reader the branch is frozen.
      #   • doc-refs — a path in CLAUDE.md that has moved. Cheap to check and
      #     read at the start of every session, so a stale one costs every one.
      - name: Extension tests
        if: ${{ !cancelled() }}
        run: node scripts/test-extensions.mjs
      - name: PRD lint
        if: ${{ !cancelled() }}
        run: node scripts/prd-lint.mjs
      - name: Doc path refs
        if: ${{ !cancelled() }}
        run: node scripts/doc-refs.mjs
      # US-2793: the same question of the ~1100 path references inside CODE
      # comments, which doc-refs.mjs does not read. All three of its first
      # findings were a comment naming a GUARD by a filename that had been
      # renamed, while the guard was alive under another name.
      - name: Comment path refs
        if: ${{ !cancelled() }}
        run: node scripts/check-comment-path-refs.mjs
      # US-2802: form fields the edge parses that no client can send. The first
      # run found that the photo Live Capture tier has never issued its badge
      # once — evaluateLiveCapture returns early on an opt-in nothing sets — and
      # that the seller-declared style-attribute hint has only ever filtered an
      # empty list. Nothing about either looked dead: the parser, the column,
      # the pipeline read and the certificate render were all alive.
      - name: Unfed form fields
        if: ${{ !cancelled() }}
        run: node scripts/check-unfed-form-fields.mjs
      # US-2804: a .select() naming a column that does not exist. Not a silent
      # null — PostgREST answers 42703 and the whole query fails, so the route
      # never worked. Seven were found on the first run, including the eBay
      # refund route and the offer-delete ownership check, both answering 500
      # to every caller since the day they were written. tsc cannot see this:
      # the repo casts supabase results with `as Array<{...}>` because the
      # generated types resolve to `never`, and a cast asserts whatever shape
      # you write.
      - name: Select columns exist
        if: ${{ !cancelled() }}
        run: node scripts/check-select-columns.mjs
      # US-2437: a file that is both tracked and gitignored. The ignore silently
      # does nothing, so the file reads as modified in every working tree forever
      # and each person who notices adds another dead ignore line — one path here
      # had collected four. Cheap (one git call, no Docker, no network) and in CI
      # as well as verify so a --no-verify push cannot shed it.
      - name: No tracked-and-gitignored files
        if: ${{ !cancelled() }}
        run: node scripts/check-tracked-ignored.mjs
      # US-2444: structural checks on supabase/migrations/ — no ignored paths,
      # no duplicate version prefixes, no unexplained gap in the sequence. Runs
      # HERE and not in db-migrations.yml on purpose: that workflow is path-
      # filtered to supabase/migrations/**, and the change that lost 00122 was a
      # .gitignore edit, which would not have triggered it. Needs only git.
      - name: Migrations lint
        if: ${{ !cancelled() }}
        run: node scripts/migrations-lint.mjs
      # US-2402: same gap again. The UI anti-pattern gate (US-2336) was a verify
      # lane only, so the hook was stricter than CI and a --no-verify push shed
      # it entirely — for a gate whose ENFORCED rules block on the tells the
      # project's own UI guidance rules out. Its noise baseline is now 0, so any
      # finding at all is real.
      - name: UI anti-patterns
        if: ${{ !cancelled() }}
        run: node scripts/check-ui-antipatterns.mjs
      # US-2495: an edge lib module whose tests pass while nothing imports it.
      # Every hand-run sweep of the underlying audit found a real defect,
      # including the unwired edge half of a P1 shipped feature (US-1995) — so
      # it stops depending on someone remembering the script exists. Allowlisted
      # modules carry the triage verdict a human already reached.
      - name: Unwired edge modules
        if: ${{ !cancelled() }}
        run: node scripts/check-unwired-modules.mjs
      # The same question asked of the React app, which had nothing. The
      # exports audit that already sweeps src/ cannot answer it: it protects
      # test-only exports as a class (415 of them, correctly - un-exporting one
      # breaks the test and shrinks nothing), so a module whose every export is
      # test-only reads as correct rather than as code that does not run. First
      # run found src/lib/list-sort.ts, superseded by US-2196.
      - name: Unwired src modules
        if: ${{ !cancelled() }}
        run: node scripts/check-web-unwired.mjs
      # The same question of the two native clients, where it cannot be asked by
      # an import graph at all: Swift and Kotlin need no import between files in
      # a module, so a screen nobody opens compiles and lints clean. Both are
      # one-second text scans and both found real features nobody could reach.
      - name: Unreachable client code (iOS + Android)
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-ios-orphans.mjs
          node scripts/check-android-orphans.mjs
      # US-417: guard the eager (landing/cold-load) chunk graph — fail the build
      # if the entry/eager gz size regresses past budget, or if a heavy primitive
      # (radix Dialog/Select/Popover, TipTap) stops being code-split and rides
      # into the eager graph. Reads build-meta/bundle-modules.json from the build.
      # Unlike the gates above this one is NOT `!cancelled()`-only: it reads
      # build-meta/bundle-modules.json, which only exists if Build succeeded. If
      # the build failed it would fail on a missing artifact and report a bundle
      # regression that isn't real, so it runs only on a successful build.
      - name: Bundle-size budget + code-splitting guard
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/check-bundle-budget.mjs

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # US-511: build the SPA, then run Playwright against `vite preview` of the
      # built artifact. Supabase/Stripe are mocked per-test (page.route), so no
      # live backend / secrets are needed — it runs on an ephemeral runner.
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
