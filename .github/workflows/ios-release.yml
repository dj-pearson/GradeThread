name: iOS Release

# Fires when:
#   - any push to main that touches ios/** — auto-cuts a TestFlight build
#   - a tag matching ios-v* is pushed (explicit version bumps)
#   - someone clicks "Run workflow" from the Actions tab
#
# Outputs per trigger:
#   - main push        → archive + TestFlight upload to the 'Internal' tester group
#   - ios-v* tag       → archive + TestFlight upload (release-notes from tag annotation)
#   - workflow_dispatch → as above; submit_to_app_store flag also runs the
#                        review-submission flow if the operator opts in.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-release.yml"
    tags:
      - "ios-v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release number / marketing version, e.g. 1.0.0 (blank = keep project default; build number always auto-increments)"
        type: string
        default: ""
      submit_to_app_store:
        description: "Submit to App Store after upload?"
        type: boolean
        default: false
      release_notes:
        description: "TestFlight release notes (optional — auto-generated from git log when blank)"
        type: string
        default: ""

concurrency:
  # Serialize releases (they fight over the keychain) AND cancel an in-progress
  # build when a newer commit lands: during active development on main a flurry
  # of ios/** pushes would otherwise queue into hours of back-to-back archives
  # where only the last build matters. Cancelling is safe — each job gets a
  # fresh runner with an ephemeral $RUNNER_TEMP keychain, so nothing leaks.
  # (A deliberate `ios-v*` tag release won't be racing main pushes in practice;
  # cut the tag once main is quiet, or trigger via workflow_dispatch.)
  group: ios-release
  cancel-in-progress: true

# US-522: least privilege. The release flow reads the repo and authenticates to
# TestFlight via job secrets (App Store Connect API key) — it never writes back
# to the repo, so the default GITHUB_TOKEN is read-only here.
permissions:
  contents: read

jobs:
  release:
    name: Archive + TestFlight upload
    # Needs Xcode 26 (iOS 26 SDK) — App Store Connect rejects anything built
    # with an older SDK. Xcode 26 requires macOS 15 (Sequoia), so the runner
    # moved off macos-14.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so the release-notes step can diff against
          # the previous TestFlight tag.
          fetch-depth: 0

      - name: Import signing secrets from Infisical
        # Pulls the App Store Connect + code-signing secrets from self-hosted
        # Infisical into $GITHUB_ENV, so every later step reads them as shell
        # vars exactly as the old job-level env: block did. Only the three
        # INFISICAL_* values live in GitHub Actions secrets now.
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: grade-thread
          env-slug: prod
          secret-path: /

      - name: Select Xcode
        # App Store Connect now rejects any build made with an SDK older than
        # iOS 26, which ships in Xcode 26. Pin to the newest Xcode 26.x on the
        # runner image (don't hardcode a point release — the image bumps it),
        # and fail loudly if the image somehow lacks one.
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:" >&2
            ls -d /Applications/Xcode_*.app >&2 || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Flip aps-environment to production
        # Entitlements file ships with aps-environment=development so local
        # Xcode-signed builds talk to the APNs sandbox. TestFlight + App
        # Store builds need 'production' or silent-push delivery is dropped
        # at the APNs gateway with no error. PlistBuddy is part of macOS;
        # no install needed.
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" \
            GradeThread/GradeThread.entitlements
          echo "aps-environment is now:"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" \
            GradeThread/GradeThread.entitlements

      - name: Build release notes
        id: release_notes
        # Auto-populate the TestFlight 'What to test' field from the
        # commits between the previous ios-v* tag and HEAD. Manual
        # override via the workflow_dispatch input wins when non-empty.
        # Tag pushes use the tag annotation directly.
        #
        # MANUAL_NOTES via env (not `${{ }}` in-script): a manual note with a
        # quote (e.g. "Levi's") would otherwise break the shell quoting.
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          MANUAL="$MANUAL_NOTES"
          if [ -n "$MANUAL" ]; then
            NOTES="$MANUAL"
          elif [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            # Tag annotation wins. Strip the "tag $TAG\n\n" header that
            # `git tag -l --format` adds and keep the body.
            NOTES=$(git for-each-ref --format='%(contents)' "$GITHUB_REF")
          else
            PREV=$(git tag -l 'ios-v*' --sort=-creatordate | head -n1 || true)
            if [ -z "$PREV" ]; then
              NOTES=$(git log -10 --pretty=format:'- %s' -- ios/)
            else
              NOTES=$(git log "$PREV"..HEAD --pretty=format:'- %s' -- ios/)
            fi
          fi
          # GitHub Actions multi-line output via heredoc.
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
          echo "----- Release notes for this build -----"
          echo "$NOTES"

      - name: Import signing certificate
        # Build an ephemeral keychain so nothing leaks between runs. The
        # keychain is destroyed in the "Clean up" step regardless of outcome.
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"

          # Fail loudly + early if a signing secret didn't make it out of
          # Infisical, instead of letting `security import` blow up later with
          # an opaque errSecParam.
          : "${BUILD_CERTIFICATE_BASE64:?missing from env (check Infisical prod /)}"
          : "${P12_PASSWORD:?missing from env (check Infisical prod /)}"
          : "${KEYCHAIN_PASSWORD:?missing from env (check Infisical prod /)}"

          # `--decode` ignores whitespace but not invalid alphabet chars; -A
          # tolerates trailing garbage. Strip CRs in case the secret was stored
          # with Windows line endings.
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n' | base64 --decode -o "$CERT_PATH"

          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::Decoded certificate is empty — BUILD_CERTIFICATE_BASE64 is not valid base64." >&2
            exit 1
          fi

          # Diagnostic only (non-fatal): tells us up front whether the bytes are
          # a real PKCS#12 and whether P12_PASSWORD opens it, so a bad secret
          # surfaces as a clear message rather than SecKeychainItemImport's
          # generic "parameters were not valid". `-legacy` handles p12s exported
          # by OpenSSL 1.x that OpenSSL 3 otherwise can't read.
          if ! openssl pkcs12 -in "$CERT_PATH" -nokeys -passin pass:"$P12_PASSWORD" -legacy -noout 2>/tmp/p12err \
             && ! openssl pkcs12 -in "$CERT_PATH" -nokeys -passin pass:"$P12_PASSWORD" -noout 2>>/tmp/p12err; then
            echo "::warning::Could not open the .p12 with the supplied P12_PASSWORD; security import will likely fail. Verify BUILD_CERTIFICATE_BASE64 is a base64-encoded .p12 (not .cer/.pem) and that P12_PASSWORD matches it." >&2
            sed 's/^/  openssl: /' /tmp/p12err >&2 || true
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Save for later steps.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profiles
        # Manual App Store signing needs one distribution profile per bundle:
        # the app, the Share Extension, and the Widget. Each is a base64 of the
        # .mobileprovision downloaded from the Apple portal (App Store type).
        # We print each profile's Name so a mismatch with the
        # PROVISIONING_PROFILE_SPECIFIER values in project.yml is obvious.
        run: |
          set -euo pipefail
          : "${PROVISIONING_PROFILE_APP_BASE64:?missing from env (check Infisical prod /)}"
          : "${PROVISIONING_PROFILE_SHARE_BASE64:?missing from env (check Infisical prod /)}"
          : "${PROVISIONING_PROFILE_WIDGET_BASE64:?missing from env (check Infisical prod /)}"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local tmp
            tmp="$(mktemp "$RUNNER_TEMP/profile.XXXXXX")"
            printf '%s' "$1" | tr -d '\r\n' | base64 --decode -o "$tmp"
            local uuid name
            uuid=$(security cms -D -i "$tmp" | plutil -extract UUID raw -)
            name=$(security cms -D -i "$tmp" | plutil -extract Name raw -)
            cp "$tmp" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "Installed '$name' ($uuid)"
          }
          install_profile "$PROVISIONING_PROFILE_APP_BASE64"
          install_profile "$PROVISIONING_PROFILE_SHARE_BASE64"
          install_profile "$PROVISIONING_PROFILE_WIDGET_BASE64"

      - name: Install App Store Connect API key
        # altool reads the key from this exact directory by Key ID.
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_API_KEY_ID:?missing from env (check Infisical prod /)}"
          : "${APP_STORE_CONNECT_API_ISSUER_ID:?missing from env (check Infisical prod /)}"
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?missing from env (check Infisical prod /)}"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          # Strip CRs in case the secret was stored with Windows line endings;
          # a stray \r corrupts the decoded key and yields an opaque -26000.
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | tr -d '\r\n' | base64 --decode -o "$KEY_PATH"

          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::Decoded API key is empty — APP_STORE_CONNECT_API_KEY_BASE64 is not valid base64." >&2
            exit 1
          fi

          # Validate it's a real EC private key (the .p8 Apple issues is an
          # unencrypted PKCS#8 EC key). Use `openssl pkey` — the `pkcs8`
          # subcommand has no -noout, which made an earlier version of this
          # step fail on a perfectly good key. If this fails, the secret is
          # corrupt/wrong; if it passes but the upload still 401s, the Key
          # ID/Issuer pair is wrong or revoked.
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/tmp/p8err; then
            echo "::error::AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 is not a valid PKCS#8 key. Verify APP_STORE_CONNECT_API_KEY_BASE64 is the base64 of the .p8 that matches Key ID ${APP_STORE_CONNECT_API_KEY_ID}." >&2
            sed 's/^/  openssl: /' /tmp/p8err >&2 || true
            exit 1
          fi

          # Non-secret shape diagnostics — catches swapped Key ID/Issuer values.
          echo "Key ID length:    ${#APP_STORE_CONNECT_API_KEY_ID} (expect 10)"
          echo "Issuer ID length: ${#APP_STORE_CONNECT_API_ISSUER_ID} (expect 36, UUID)"
          case "$APP_STORE_CONNECT_API_ISSUER_ID" in
            ????????-????-????-????-????????????) echo "Issuer ID shape: looks like a UUID ✓" ;;
            *) echo "::warning::Issuer ID is not in UUID form (8-4-4-4-12). It may be swapped with the Key ID or pasted incorrectly." ;;
          esac

      - name: Resolve build number
        id: build_number
        # Use the GitHub run number so each build is monotonic across the
        # repo lifetime — App Store Connect rejects re-used build numbers.
        run: echo "value=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Resolve marketing version
        id: marketing
        # The release number (CFBundleShortVersionString). Priority:
        #   1. workflow_dispatch "release_version" input (manual run)
        #   2. an ios-vX.Y.Z tag push  -> X.Y.Z
        #   3. blank -> the archive keeps the project default (project.yml
        #      MARKETING_VERSION), so push-to-main builds Just Work.
        run: |
          set -euo pipefail
          MV='${{ inputs.release_version }}'
          if [ -z "$MV" ] && [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            MV="${GITHUB_REF#refs/tags/ios-v}"
          fi
          echo "value=$MV" >> "$GITHUB_OUTPUT"
          if [ -n "$MV" ]; then
            echo "Marketing version override: $MV"
          else
            echo "No override — using project default MARKETING_VERSION from project.yml."
          fi

      - name: Require telemetry secrets
        # US-787: a production build must ship with crash reporting. Previously
        # SENTRY_DSN/POSTHOG_API_KEY weren't injected, so every TestFlight / App
        # Store build shipped with telemetry compiled out — a prod crash was
        # invisible. Fail loudly when SENTRY_DSN is missing (set
        # ALLOW_NO_TELEMETRY=1 in the env for a deliberate one-off). PostHog is
        # analytics-only → warn, don't fail.
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_DSN:-}" ] && [ "${ALLOW_NO_TELEMETRY:-}" != "1" ]; then
            echo "::error::SENTRY_DSN is empty — this release build would ship with NO crash reporting. Add SENTRY_DSN to Infisical (prod env), or set ALLOW_NO_TELEMETRY=1 to bypass." >&2
            exit 1
          fi
          if [ -z "${POSTHOG_API_KEY:-}" ]; then
            echo "::warning::POSTHOG_API_KEY is empty — product analytics will be disabled in this build."
          fi

      - name: Require captcha site key
        # US-368: prod GoTrue rejects signup / email-password sign-in / reset
        # that lack a Turnstile token. A release build with no TURNSTILE_SITE_KEY
        # renders no widget → no token → those flows 400 (the App Store 2.1(a)
        # rejection on v1.0(41)). Fail loudly so we never ship that again.
        # Set ALLOW_NO_CAPTCHA=1 only if captcha has been disabled server-side.
        run: |
          set -euo pipefail
          if [ -z "${TURNSTILE_SITE_KEY:-}" ] && [ "${ALLOW_NO_CAPTCHA:-}" != "1" ]; then
            echo "::error::TURNSTILE_SITE_KEY is empty — native signup/sign-in/reset will be rejected by GoTrue's captcha gate. Add TURNSTILE_SITE_KEY to Infisical (prod env), or set ALLOW_NO_CAPTCHA=1 if captcha is disabled server-side." >&2
            exit 1
          fi

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          # Manual App Store signing — all signing settings (style, identity,
          # team, per-target PROVISIONING_PROFILE_SPECIFIER) live in project.yml's
          # Release config, scoped to the 3 app targets only. We deliberately do
          # NOT pass CODE_SIGN_* or -allowProvisioningUpdates on the CLI: those
          # apply to EVERY target including the Swift Package deps (auto-signed
          # for development) and blow up with "conflicting provisioning settings".
          # The 3 distribution profiles are installed in the step above; xcodebuild
          # matches them by the specifier names.
          #
          # Only override MARKETING_VERSION when one was resolved; otherwise
          # leave it unset so the archive uses project.yml's default.
          VERSION_ARGS=()
          MV='${{ steps.marketing.outputs.value }}'
          if [ -n "$MV" ]; then VERSION_ARGS+=("MARKETING_VERSION=$MV"); fi
          # TEMP DIAGNOSTIC: disable -e around the pipeline so a build failure
          # doesn't abort the step before the raw-log grep below runs. pipefail
          # stays on; PIPESTATUS[0] still captures xcodebuild's real exit code.
          set +e
          xcodebuild \
            -project GradeThread.xcodeproj \
            -scheme GradeThread \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GradeThread.xcarchive" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            TURNSTILE_SITE_KEY="${TURNSTILE_SITE_KEY:-}" \
            SENTRY_DSN="${SENTRY_DSN:-}" \
            POSTHOG_API_KEY="${POSTHOG_API_KEY:-}" \
            POSTHOG_HOST="${POSTHOG_HOST:-https://us.i.posthog.com}" \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.value }} \
            "${VERSION_ARGS[@]}" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-raw.log" | xcbeautify --renderer github-actions
          ARCHIVE_RC=${PIPESTATUS[0]}
          set -e
          # TEMP DIAGNOSTIC: xcbeautify strips the file path from compile errors
          # (it turns them into ::error annotations GitHub consumes), so on a
          # build failure echo the raw, path-bearing diagnostic lines here where
          # they survive in the plain log. Revert once the failing file is known.
          echo "::group::Raw xcodebuild errors (path-bearing)"
          grep -nE "error: |unable to type-check this expression" "$RUNNER_TEMP/xcodebuild-raw.log" | head -60 || true
          echo "::endgroup::"
          exit "$ARCHIVE_RC"

      - name: Verify entitlements in archive
        # Isolates WHERE custom entitlements (applesignin, associated-domains,
        # app-groups, aps-environment) are lost: the .app inside the .xcarchive
        # is what archive produced, before export re-signs. If they're present
        # here but absent in the exported IPA → export strips them. If absent
        # here too → archive never applied GradeThread.entitlements (likely the
        # command-line CODE_SIGN_STYLE=Automatic override shadowing the
        # per-target CODE_SIGN_ENTITLEMENTS). Non-fatal diagnostic.
        run: |
          set -uo pipefail
          APP="$RUNNER_TEMP/GradeThread.xcarchive/Products/Applications/GradeThread.app"
          echo "Inspecting archived app: $APP"
          echo "----- Archived binary entitlements -----"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          echo ""
          if codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q 'com.apple.developer.applesignin'; then
            echo "✅ Archive HAS applesignin → loss happens at EXPORT"
          else
            echo "::warning::Archive is MISSING applesignin → loss happens at ARCHIVE (CODE_SIGN_ENTITLEMENTS not applied during archive)."
          fi
          exit 0

      - name: Upload dSYMs to Sentry
        # US-787: upload debug symbols so production crashes symbolicate. Runs
        # only when a Sentry auth token is configured (Infisical prod), and is
        # best-effort — the archive already succeeded, so a symbol-upload hiccup
        # must not fail the release.
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT come from Infisical
          # (prod env) via $GITHUB_ENV, same as the other build secrets.
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            "$RUNNER_TEMP/GradeThread.xcarchive/dSYMs"

      - name: Export .ipa
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.gradethread.app</key>
                  <string>GradeThread App Store</string>
                  <key>com.gradethread.app.share-extension</key>
                  <string>GradeThread ShareExtension AppStore</string>
                  <key>com.gradethread.app.widget</key>
                  <string>GradeThread Widget AppStore</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

          # Manual export — re-signs each bundle with the matching App Store
          # profile from ExportOptions. No -allowProvisioningUpdates (that's the
          # automatic path) and no API key needed here; altool uploads later.
          set -o pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/GradeThread.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | xcbeautify --renderer github-actions

      - name: Verify Sign in with Apple entitlement
        # We can't run codesign on a dev Mac, so verify here: does the SIGNED
        # app — and the provisioning profile embedded in it — actually carry
        # com.apple.developer.applesignin? A bare ASAuthorizationError 1000 on
        # device (no sheet, no network) is the signature of this entitlement
        # being absent from the signed build even though GradeThread.entitlements
        # requests it (App ID capability not authorized into the profile, or a
        # stale profile). Non-fatal: prints PASS/FAIL so the build still uploads
        # and we can read the result.
        run: |
          set -uo pipefail
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -n1)
          WORK="$RUNNER_TEMP/ipa-inspect"
          rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q -o "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -n1)
          echo "Inspecting: $APP"

          echo "----- Signed binary entitlements -----"
          BIN_ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          printf '%s\n' "$BIN_ENT"

          echo "----- Capabilities in embedded provisioning profile -----"
          PROFILE=$(security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null || true)
          printf '%s\n' "$PROFILE" | grep -o 'com\.apple\.developer\.[a-zA-Z.-]*' | sort -u || true

          MISSING=0
          if printf '%s' "$BIN_ENT" | grep -q 'com.apple.developer.applesignin'; then
            echo "✅ Signed binary carries com.apple.developer.applesignin"
          else
            echo "::error::Signed binary is MISSING com.apple.developer.applesignin — this is the root cause of AuthorizationError 1000 on device."
            MISSING=1
          fi
          if printf '%s' "$PROFILE" | grep -q 'com.apple.developer.applesignin'; then
            echo "✅ Embedded provisioning profile authorizes Sign in with Apple"
          else
            echo "::error::Embedded provisioning profile does NOT authorize Sign in with Apple — regenerate the App Store distribution profile AFTER enabling the capability on App ID com.gradethread.app, then update PROVISIONING_PROFILE_BASE64 in Infisical."
            MISSING=1
          fi
          if [ "$MISSING" = 1 ]; then
            echo "::warning::Sign in with Apple entitlement gap detected — see errors above. Build still uploaded so other flows remain testable."
          fi
          exit 0

      - name: Upload to TestFlight
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -n1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Surface release notes
        # TestFlight 'What to test' for the just-uploaded build is set
        # via the App Store Connect API on a betaBuildLocalizations
        # POST that needs the resolved BUILD ID — which only exists
        # after Apple finishes processing the upload (~5-10 min).
        # Rather than poll fragily in CI, we surface the notes in the
        # workflow summary so the operator can paste them into the
        # build's "What to test" field once it lands in App Store Connect.
        # When you're ready to fully automate this, switch the upload
        # step above to `fastlane pilot upload --changelog ...`.
        #
        # NOTES/BUILD_NUMBER are passed via env (NOT `${{ }}` interpolated into
        # the script): GitHub sets env values verbatim, so a commit subject
        # containing double quotes — e.g. `Save ("Save & Sync")` — can't break
        # the shell quoting and abort the job (exit 127). `printf` then emits
        # the multi-line value safely.
        env:
          NOTES: ${{ steps.release_notes.outputs.notes }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
        run: |
          {
            echo "## TestFlight release notes for build #${BUILD_NUMBER}"
            echo ""
            echo '```'
            printf '%s\n' "$NOTES"
            echo '```'
            echo ""
            echo "Paste these into the build's 'What to test' field in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit for App Store review
        # Only when manually triggered with submit_to_app_store=true. Tag
        # pushes default to TestFlight-only so accidental tags don't kick a
        # build into App Review (US-197).
        #
        # The binary was already uploaded by altool above; fastlane deliver
        # here pushes the repo's metadata (ios/fastlane/metadata) + any
        # captured screenshots, runs Apple's precheck, and submits for
        # review. Auth is the same App Store Connect API key the upload
        # step used — surfaced via the job-level env vars the Fastfile reads.
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_app_store == true
        working-directory: ios
        run: |
          gem install bundler --no-document
          bundle install --jobs 4 --retry 3
          bundle exec fastlane release

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-${{ steps.build_number.outputs.value }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" || true
