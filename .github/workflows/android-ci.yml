# Android CI (US-1300, extended by US-2502) — the compile gate for android/**.
#
# Mirrors the iOS CI role: Windows dev machines verify locally with
# `npm run verify:android` (which runs this exact list, in this exact order,
# from scripts/verify.mjs), and this lane is the neutral second net on every
# push.
#
# US-2502 added everything Android Studio used to be the only way to run:
# formatting, Kotlin static analysis, lint as a gate rather than a report,
# coverage with a floor, and rendered-UI diffs. If you add a step here, add it
# to the `on("android")` block in scripts/verify.mjs too — the two lists
# drifting apart is how "it passed locally" starts meaning nothing.
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Re-record the Roborazzi goldens on this runner and upload them"
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: assembleDebug + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # US-2502: the unit tests build the real Hilt graph, and NetworkModule
    # constructs SupabaseShared, which asserts BuildConfig.SUPABASE_ANON_KEY is
    # non-blank. `secret()` in app/build.gradle.kts reads the CI env first, then
    # local.properties, then an empty placeholder — and a runner has no
    # local.properties, so the field was "" and 161 tests died in setup with
    # "SUPABASE_ANON_KEY missing". A dev machine never saw it because
    # android:doctor writes local.properties.
    #
    # Same shape as ci.yml's env block and for the same reason: these are public
    # client-side config values, the key here is a throwaway placeholder, and
    # nothing in a Robolectric test opens a socket. The URL is left to its
    # build.gradle.kts default.
    env:
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Spotless ratchets against origin/main (see app/build.gradle.kts):
          # on a shallow clone it cannot find the merge base and falls back to
          # checking every file, which fails on 435 files that predate it.
          fetch-depth: 0

      - name: Make origin/main resolvable
        # A PR checkout has the head ref but not necessarily the base branch.
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The .mjs guards below run on Node, not on the JVM.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The ubuntu-latest image ships the Android SDK; ANDROID_HOME is preset.
      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------------- guards
      # Seconds each, and they catch what no compiler can. All of them run
      # BEFORE the build, because the build is minutes.

      # US-1391: the Android half of the iOS print guard. android.util.Log is
      # NOT stripped by R8 unless a proguard rule removes it, so an ungated
      # Log.d can put a session token or a seller's address into logcat, where
      # every bug-report capture reads it.
      - name: No ungated logging
        run: python3 scripts/no-ungated-log.py

      # US-1393: hardcoded UI text can never be translated, and nothing about
      # it looks wrong in review — it renders perfectly in English forever.
      - name: No bare strings (scoped)
        run: python3 scripts/no-bare-strings.py

      # US-2368: a stringResource call whose argument count disagrees with the
      # resource compiles fine and throws when the screen is drawn — in whichever
      # language the mismatched placeholder lives in.
      - name: No unlocalized copy outside Compose
        # The other half of the bare-strings problem: copy written in a plain
        # Kotlin object and handed to a Compose sink as a String, so the literal
        # is never at the sink the other guard watches. Ratchets against
        # scripts/unlocalized-copy-baseline.json, which can only shrink.
        run: python3 scripts/no-unlocalized-copy.py

      - name: String format arity
        run: python3 scripts/check-string-formats.py

      # US-2502: a Room version whose schema JSON was never committed can never
      # be migration-tested, and the file cannot be produced after the fact.
      # Versions 3 and 4 were already lost that way; this stops the next one.
      - name: Room schemas exported
        run: node scripts/check-room-schemas.mjs

      # US-2892: the release-config checker guards android-release.yml, which
      # runs rarely and matters enormously. Its SELF-TEST runs here, on every
      # push, because a gate that has quietly stopped detecting anything looks
      # exactly like a gate that keeps finding nothing -- and the release lane
      # is the worst place to discover which one it is.
      #
      # Only the self-test. The real check needs the production values, and
      # this lane deliberately builds release with empty placeholders (see the
      # note on "Build release APK" below), so running it against this
      # artifact would fail every PR for the correct reason and teach everyone
      # to ignore it.
      - name: Release-config checker still detects
        run: node scripts/check-release-config.mjs --self-test

      # US-2891: API 36 makes edge-to-edge mandatory. Screens MainActivity
      # composes DIRECTLY have no Scaffold above them applying the system-bar
      # insets, and getting it wrong is invisible to every other lane: it
      # compiles, lints clean and passes the unit suite while the sign-in
      # headline draws over the status-bar clock. Self-test first, so a check
      # that has stopped detecting anything does not read as a clean tree.
      - name: Root screens consume window insets
        run: |
          node scripts/check-root-insets.mjs --self-test
          node scripts/check-root-insets.mjs

      # US-2912 AC5: the lint and detekt baselines may only shrink. Both gates
      # below run with their baseline applied, so a NEW finding absorbed by a
      # casual `updateLintBaseline` / `detektBaseline` regeneration leaves both
      # of them green and says so nowhere. This is the only thing that notices
      # the number went up. It also fails when the number goes DOWN without the
      # ceiling being lowered, because a ceiling above reality is how a ratchet
      # stops ratcheting. Runs BEFORE the gates it protects, since it is
      # instant and they are not.
      - name: Lint and detekt baselines may only shrink
        run: node scripts/check-baseline-ratchet.mjs

      # ------------------------------------------------------- static analysis
      # US-2502. Cheapest-first: a formatting failure should not cost the eight
      # minutes assembleRelease takes to surface.

      - name: Format (spotless/ktlint)
        run: ./gradlew :app:spotlessCheck --stacktrace

      - name: Static analysis (detekt)
        run: ./gradlew :app:detekt --stacktrace

      # warningsAsErrors + lint-baseline.xml: the baseline holds what already
      # existed, so this only fires on something the change introduced.
      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publish lint findings to code scanning
        # SARIF puts each finding on the diff instead of inside a downloaded
        # zip. Never fails the job — the lint step above is the gate.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: android/app/build/reports/lint-results-debug.sarif
          category: android-lint

      # ---------------------------------------------------------------- tests
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Gradle's failure line is "There were failing tests. See the report at:
      # file:///…/index.html" — a path on a runner that no longer exists. The
      # HTML lands in the quality-reports artifact, so the answer IS available;
      # it just costs a download and an unzip before anyone knows which test
      # broke. Print the names and the assertion into the log instead, where
      # the failure is already being read.
      - name: Name the failing unit tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          shown = 0
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      shown += 1
                      print(f"\n✗ {case.get('classname')} > {case.get('name')}")
                      print(f"  {bad.get('message') or bad.get('type') or ''}".rstrip())
                      body = (bad.text or "").strip().splitlines()
                      for line in body[:12]:
                          print(f"  {line}")
          print(f"\n{shown} failing test(s)." if shown else "\nNo failing testcase in the XML results.")
          PY

      # US-2502: a floor, not a target. It cannot catch untested code that was
      # never written; it does catch a change that deletes tests.
      - name: Coverage floor (kover)
        run: ./gradlew :app:koverVerifyDebug --stacktrace

      # US-2502 / US-2902: rendered-UI diffs. BLOCKING as of 2026-08-29.
      #
      # IT WAS NON-BLOCKING BECAUSE OF A WORRY THAT TURNED OUT TO BE WRONG, and
      # it spent 2026-08-25 to 2026-08-29 RED without anyone seeing it.
      #
      # THE WORRY: sub-pixel antialiasing might differ between a Windows
      # checkout and this runner, so the gate would be red for a reason nobody
      # could fix. It does not: the runner failed the SAME single test as a
      # Windows checkout, at the same assertion line. The host was never the
      # variable.
      #
      # THE REAL CAUSE: 540d9648d (US-2891, target API 36) bumped Robolectric
      # 4.14.1 -> 4.16.1, and its native graphics round alpha compositing one
      # bit differently. Pixel diff against the pre-bump goldens: FOUR of the
      # seven moved, every one of them by a MAXIMUM per-channel delta of 1 or 2
      # — buttons-dark 245 pixels, error-state 6, status-badges-light 67093,
      # status-badges-dark 75176. Not a layout, colour or font change: a
      # rounding change no eye can see, and the compare image confirms it.
      #
      # ⚠ ONLY ONE CROSSED THE THRESHOLD, AND THAT IS WHY "0.000000" MISLED ME
      # FIRST TIME. Roborazzi's diff_percentage is a WEIGHTED metric, not the
      # fraction of differing pixels: status-badges-light had 31% of its pixels
      # differ and still reported 0.000000, because every delta there is 1.
      # status-badges-dark reported 0.022547 because 4832 of its deltas are 2.
      # A Roborazzi 0.000000 means "below its weighting", NOT "identical" —
      # do not read it as byte-equality the way an earlier version of this
      # comment did.
      #
      # The goldens were re-recorded on 4.16.1 in that same commit. That is
      # allowed HERE and not in general: "a golden re-recorded on its own is the
      # assertion deleted" is about hiding a real change, and this one is
      # measured, explained, and bounded at 2/255.
      #
      # AND IT WAS INVISIBLE, WHICH IS WHY IT IS BLOCKING NOW. `gh run view <id>
      # --json jobs` reported this step's conclusion as "success" for four
      # straight runs whose own logs say "2088 tests completed, 1 failed" and
      # "BUILD FAILED" — continue-on-error rewrites a STEP's conclusion. A
      # non-blocking step is meant to be visible and merely not fatal; this one
      # could not be seen from the API at all.
      - name: Screenshot tests (Roborazzi)
        if: ${{ !inputs.record_screenshots }}
        run: ./gradlew :app:verifyRoborazziDebug --stacktrace

      - name: Re-record the screenshot goldens
        if: ${{ inputs.record_screenshots }}
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Upload the re-recorded goldens
        if: ${{ inputs.record_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-goldens
          path: android/app/src/test/screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the screenshot diff report
        # One expression, not `failure() || ${{ ... }}` — literal text beside a
        # replacement token makes the whole condition truthy, which would run
        # this on the record path too and upload an empty diff directory.
        if: ${{ always() && !inputs.record_screenshots }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-report
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------------- builds
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # US-1391 AC3: on Android the widget, the share target and the deep links
      # are components the SYSTEM finds by reading the merged manifest — no app
      # code calls them. So a merge that drops one is a green build and an app
      # with no widget in the picker and nothing in the share sheet.
      - name: Widget, share target and deep links survive the manifest merge
        run: node scripts/check-merged-manifest.mjs

      - name: Assemble the instrumented test APK
        # Compiles androidTest without needing an emulator, so a broken test
        # source fails HERE, in the blocking lane, rather than only in the
        # non-blocking emulator job where a red X is easy to scroll past.
        #
        # The `e:` lines Kotlin prints are followed by ~150 frames of Gradle
        # stack trace, so the end of a failed log is all frames and none of the
        # error. Repeat them last.
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/androidtest.log"; then
            echo "----- compiler errors, repeated so the log tail carries them -----"
            grep -E '^(e: |error: )' "$RUNNER_TEMP/androidtest.log" | head -50 \
              || echo "(no e:/error: lines — the failure above is not a compile error)"
            exit 1
          fi

      # US-1391: proves the release lane works — minification, the proguard
      # rules, and the signing config. Unsigned on a PR (no secret is exposed
      # to a fork), which still catches an R8 rule that strips something the
      # app needs at runtime.
      #
      # US-2892 — WHAT THIS ARTIFACT IS NOT. It carries no SUPABASE_ANON_KEY, no
      # SENTRY_DSN and no FIREBASE_*: `secret()` in build.gradle.kts defaults
      # each to an empty string, so this APK builds cleanly and would throw out
      # of AppConfig.validateAtStartup() on the first launch. That is fine and
      # intended — the point here is R8 and the manifest merge, not a runnable
      # app. Do NOT hand this APK to a tester, and do not read a green run here
      # as "the release is configured". The bundle that ships is built by
      # android-release.yml, which asserts the config both before the build and
      # against the finished binary.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      # US-2502: the release variant merges a different manifest and runs R8, so
      # it reaches conclusions lintDebug cannot — a keep rule that is missing,
      # a resource shrunk away, a permission a release-only dependency added.
      # Runs after assembleRelease so an R8 failure reports against the cheaper
      # task first.
      - name: Android Lint (release variant)
        run: ./gradlew :app:lintRelease --stacktrace

      # US-2150: the artifact that actually ships. A universal APK makes every
      # phone download all four copies of ML Kit's native OCR pipeline; the
      # bundle lets Play send one. Built AFTER assembleRelease so an R8 failure
      # still reports against the cheaper task.
      - name: Build release App Bundle
        run: ./gradlew bundleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      # US-2150 AC3: the bundle fixes the download; this stops the NEXT model
      # dependency from doubling it in silence. Prints a per-ABI table into the
      # job summary and fails on a budget breach.
      #
      # The self-test runs first and needs no bundle: a size gate that only
      # ever sees passing input is one that reports PASS forever, so the two
      # failures that matter (over budget, unwatched ABI) are exercised against
      # a synthetic bundle every run.
      - name: 16 KB page-size compatibility
        # US-2893: Play requires 16 KB page support for apps targeting Android
        # 15+. A 4 KB-aligned .so installs and then fails to load, which
        # surfaces as a crash in the barcode scanner or the tag OCR rather than
        # as anything naming pages.
        #
        # Runs on every push, unlike the release-config check, because it needs
        # NO secrets -- the placeholder release build carries the same prebuilt
        # .so files. That matters: the app compiles none of this code, so the
        # alignment is inherited from dependencies and is lost by a version
        # bump, which is a PR-shaped event.
        run: |
          node scripts/check-16kb-alignment.mjs --self-test
          node scripts/check-16kb-alignment.mjs app/build/outputs/bundle/release/app-release.aab

      - name: Per-ABI download size
        run: |
          python3 scripts/abi-size-report.py --self-test
          python3 scripts/abi-size-report.py

      # --------------------------------------------------------------- uploads
      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload the quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/detekt/
            android/app/build/reports/kover/
            android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # US-1395 AC3: the instrumented lane, NON-BLOCKING by design.
  #
  # An emulator job is slow and flaky in ways that have nothing to do with the
  # diff — a KVM-less runner, a cold system image, an ANR under load. Making it
  # required would train everyone to re-run it until it passes, which is worse
  # than not having it. It reports; the blocking lane above still compiles the
  # same test sources, so a genuinely broken test cannot hide here.
  #
  # US-2502 note: this job now also carries RoomMigrationTest, which is the only
  # thing in the repo that proves a Room migration runs against a real SQLite.
  # It is worth knowing that a migration failure surfaces HERE, in the lane
  # people are told to treat as advisory — so read this job's result before any
  # release that contains a schema version bump.
  #
  # US-2902 AC6 — THE CONDITION FOR REMOVING `continue-on-error`, checkable
  # rather than a matter of opinion: ten consecutive runs of this job green on
  # main. Count them with
  #   gh run list --workflow="Android CI" --branch main --limit 20 \
  #     --json databaseId -q '.[].databaseId'
  # then, per id,
  #   gh run view <id> --json jobs \
  #     -q '.jobs[]|select(.name|test("Critical-flow"))|.conclusion'
  # counting only ids that return a conclusion — a `skipped` means the job never
  # ran and is evidence for nothing. A JOB conclusion is trustworthy here; a
  # STEP conclusion under continue-on-error is NOT — it is reported as "success"
  # whatever the command did, which is how the screenshot step above stayed red
  # for four runs while the API called it green.
  #
  # The count starts from the env fix below: every run before it failed on a
  # missing config string rather than on anything this lane tests. Ten rather
  # than three, because this job boots an emulator and a flake costs 25 minutes.
  instrumented:
    name: Critical-flow E2E (emulator, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    needs: build-and-test
    # US-2902: THE SAME BLOCK build-and-test CARRIES, AND FOR THE SAME REASON.
    # It was added there and not here, so every instrumented run since has died
    # in Application.onCreate with "SUPABASE_ANON_KEY missing — set it in
    # local.properties or CI env". The app crashes before a single test body
    # runs and all four tests report FAILED for one missing string. Measured
    # 2026-08-29: the last four runs that reached this job all failed this way,
    # and the workflow reported success on every one of them.
    #
    # That is what made RoomMigrationTest useless. It is the only thing in the
    # repo that proves a Room migration runs against real SQLite, the comment
    # above tells people to read this job before a schema bump, and it has not
    # executed once.
    #
    # These are public client-side config values and the key is a throwaway
    # placeholder. src/test/android-ci-env-parity.test.ts fails if the two jobs
    # drift apart again.
    env:
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        # Without it the emulator falls back to software rendering and takes
        # long enough to hit the job timeout.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34: new enough for the current AndroidX stack, old enough that
          # the image is reliably cached on the runner.
          api-level: 34
          target: google_apis
          arch: x86_64
          # An animation left on is the single most common source of a flaky
          # Compose assertion.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload the instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
