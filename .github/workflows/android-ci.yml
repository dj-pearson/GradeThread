# Android CI (US-1300) — the compile gate for the US-1299 conversion backlog.
# Mirrors the iOS CI role: Windows dev machines verify locally (JDK 17 + Gradle
# via scoop + the local SDK), and this lane is the neutral second net on every
# push touching android/**.
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: assembleDebug + unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image ships the Android SDK; ANDROID_HOME is preset.
      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # US-1391: the Android half of the iOS print guard. android.util.Log is
      # NOT stripped by R8 unless a proguard rule removes it, so an ungated
      # Log.d can put a session token or a seller's address into logcat, where
      # every bug-report capture reads it. Runs BEFORE the build, because it is
      # seconds and the build is minutes.
      - name: No ungated logging
        run: python3 scripts/no-ungated-log.py

      # US-1393: hardcoded UI text can never be translated, and nothing about
      # it looks wrong in review — it renders perfectly in English forever.
      # Scoped to the converted files; the scope list grows as more land.
      - name: No bare strings (scoped)
        run: python3 scripts/no-bare-strings.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      # US-1391 AC3: on Android the widget and the share target are components
      # of the same module, so what can actually break them is the MANIFEST
      # MERGE silently dropping one — which produces a green build and an app
      # with no widget in the picker and no entry in the share sheet.
      - name: Widget + share target survive the manifest merge
        run: |
          set -euo pipefail
          MERGED=app/build/intermediates/merged_manifests/debug/processDebugMainManifest/AndroidManifest.xml
          if [ ! -f "$MERGED" ]; then
            MERGED=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -n1)
          fi
          echo "Checking $MERGED"
          grep -q 'SellerSnapshotWidgetReceiver' "$MERGED"
          grep -q 'ShareTargetActivity' "$MERGED"
          grep -q 'android.intent.action.SEND_MULTIPLE' "$MERGED"
          echo "widget + share target present"

      # US-1391: proves the release lane works — minification, the proguard
      # rules, and the signing config. Unsigned on a PR (no secret is exposed
      # to a fork), which still catches an R8 rule that strips something the
      # app needs at runtime.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Assemble the instrumented test APK
        # Compiles androidTest without needing an emulator, so a broken test
        # source fails HERE, in the blocking lane, rather than only in the
        # non-blocking emulator job where a red X is easy to scroll past.
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # US-1395 AC3: the instrumented lane, NON-BLOCKING by design.
  #
  # An emulator job is slow and flaky in ways that have nothing to do with the
  # diff — a KVM-less runner, a cold system image, an ANR under load. Making it
  # required would train everyone to re-run it until it passes, which is worse
  # than not having it. It reports; the blocking lane above still compiles the
  # same test sources, so a genuinely broken test cannot hide here.
  instrumented:
    name: Critical-flow E2E (emulator, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    needs: build-and-test
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        # Without it the emulator falls back to software rendering and takes
        # long enough to hit the job timeout.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34: new enough for the current AndroidX stack, old enough that
          # the image is reliably cached on the runner.
          api-level: 34
          target: google_apis
          arch: x86_64
          # An animation left on is the single most common source of a flaky
          # Compose assertion.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload the instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
