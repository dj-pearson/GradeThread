name: Secret scan (full history)

# US-2284: sweep the WHOLE history, on a schedule, not per push.
#
# The existing per-push scan (secret-scan.yml) cannot find a leak that is
# already in history. gitleaks-action in push/PR mode scans the commits in the
# event — so once a secret lands, every subsequent run is green while the secret
# sits there. That is exactly what happened: extension.pem (the Chrome Web Store
# signing identity) was committed on 2026-07-13 and the scan stayed green for
# weeks.
#
# So this job exists to answer a different question from the per-push one.
# Per-push asks "is this change clean?"; this asks "is the repository clean?".
# Both are needed, and only the second one finds a leak nobody noticed landing.
#
# It runs weekly rather than per-push because a full-history scan is slow and
# its finding is not tied to any one commit — a nightly cadence would just be a
# louder version of the same weekly answer. workflow_dispatch is there so an
# audit can run it on demand without waiting for Monday.

on:
  schedule:
    # Mondays 06:00 UTC — a finding lands at the start of the week, when someone
    # is around to act on it, rather than into a Friday evening.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-history
  cancel-in-progress: false

jobs:
  gitleaks-history:
    name: gitleaks (entire history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout every commit
        uses: actions/checkout@v4
        with:
          # The whole point. fetch-depth: 0 is what makes `detect` see history
          # rather than a single commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Deliberately the binary rather than gitleaks-action: the action decides
      # its own scan scope from the triggering event, and on a schedule there is
      # no diff to scan. `detect` over the checked-out repo is unambiguous.
      - name: Scan full history
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks-history.sarif \
            --exit-code 1

      # Uploaded even on failure — the whole value of a scheduled run is the
      # report, and a bare red X names nothing.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history.sarif
          if-no-files-found: ignore
          # A findings report is itself sensitive even redacted; keep it short.
          retention-days: 7
