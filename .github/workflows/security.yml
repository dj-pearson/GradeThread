name: Security

# Dependency + static-analysis gate (US-273). Secret scanning lives in the
# separate secret-scan.yml (gitleaks, US-272) so the two concerns stay focused.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories. Accepted exceptions are documented
      # in .github/SECURITY_ADVISORY_ALLOWLIST.md (resolve by upgrading the dep,
      # or record the rationale there) — do NOT lower this threshold to pass.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  deno-check:
    name: Deno lint + type-check (edge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "1.46.3"
      - run: deno lint
      # Matches the Dockerfile note that type-checking happens separately
      # (the container runs with --no-check for fast cold-starts).
      - run: deno check src/main.ts

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
