name: Security

# Dependency + static-analysis gate (US-273). Secret scanning lives in the
# separate secret-scan.yml (gitleaks, US-272) so the two concerns stay focused.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # BLOCKING gate: high/critical advisories in PRODUCTION (shipped) deps.
      # --omit=dev scopes to what actually reaches users; it does NOT lower the
      # --audit-level (still high). Build-only tooling (vite/esbuild/babel) is
      # audited non-blocking below — those advisories are dev-surface only and
      # tracked in .github/SECURITY_ADVISORY_ALLOWLIST.md. Resolve a runtime
      # advisory by upgrading the dep; do NOT lower this threshold to pass.
      - name: Audit production dependencies (blocking)
        # scripts/audit-gate.mjs runs the same audit at the same --audit-level
        # (high) and fails on every finding EXCEPT the dated, per-advisory
        # acceptances written in .github/SECURITY_ADVISORY_ALLOWLIST.md. An
        # acceptance whose "Re-check by" date has passed blocks again, so this
        # cannot become a permanent suppression by neglect.
        run: node scripts/audit-gate.mjs
      # INFORMATIONAL: full tree incl. devDependencies. Surfaces build-tool
      # advisories for triage without blocking the gate on a dev-only CVE that
      # would force a breaking build-tooling major (see the allowlist file).
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high || true

  # US-1741: deno lint/check and deno test are SEPARATE jobs on purpose.
  # Previously they were sequential steps in one job, so a lint or type-check
  # failure (e.g. US-1708's require-await error) failed the first step and
  # GitHub Actions skipped the later `deno test` step entirely — silently
  # disabling the whole edge suite and letting 6 real test failures accumulate
  # undetected across many commits. Splitting them means a red lint AND a red
  # test each surface as their own independent failing check. Both still gate
  # merge (no leniency); only visibility/ordering changed. Do NOT re-merge these
  # into one job — that would let a lint error mask the test signal again.
  deno-check:
    name: Deno lint + type-check (edge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.0"
      # US-517: frozen lockfile — fail the build if a resolved dependency
      # (e.g. a mutable esm.sh artifact) no longer matches deno.lock's recorded
      # integrity hash. This is the hard gate; the Dockerfile build stays lenient
      # for availability.
      - name: Verify dependency lockfile (frozen)
        run: deno cache --frozen src/main.ts
      - run: deno lint
      # Matches the Dockerfile note that type-checking happens separately
      # (the container runs with --no-check for fast cold-starts).
      #
      # US-2378: src/tests/ is checked here TOO, not just src/main.ts. `deno
      # test` type-checks before it runs anything, so a type error in a test
      # file means zero tests execute — the suite reports a failure that reads
      # like a compile problem, and the ~5,000 real assertions behind it stop
      # being run without anyone noticing which ones. Checking the test tree in
      # this job names the broken file directly, in the job whose whole purpose
      # is types.
      - run: deno check src/main.ts src/tests/

  deno-test:
    name: Deno test (edge)
    # Runs independently of deno-check so a lint/type-check failure can never
    # skip the edge test suite again (US-1741).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.8.0"
      # Frozen lockfile is a hard gate here too — if deps can't resolve, tests
      # can't be trusted. Kept in this job so it doesn't depend on deno-check.
      - name: Verify dependency lockfile (frozen)
        run: deno cache --frozen src/main.ts
      # Unit tests (billing math, etc.). Integration tests that need a live
      # fixture (tenant-isolation) skip cleanly when their env isn't set.
      # --allow-read lets the US-355 RLS guard read supabase/migrations.
      # US-519: --coverage records edge coverage; the summary is printed so edge
      # coverage is reported separately from the frontend's vitest coverage.
      - run: deno test --allow-net --allow-env --allow-read --coverage=cov_profile
      # US-2344 AC3: this used to be `deno coverage cov_profile || true`, which
      # printed a number and threw away its exit code — so edge coverage has
      # never been enforced. A check that cannot fail is worse than no check: it
      # occupies the slot a real one would take and looks like a safety net on
      # the dashboard. The floors are set just below the 2026-08-03 measurement,
      # so they cannot be met by accident or missed except by a real drop.
      - name: Edge coverage summary
        run: deno coverage cov_profile
      - name: Edge coverage floor
        run: deno run -A scripts/coverage-floor.mjs cov_profile

  trivy-edge-image:
    name: Trivy scan (edge Deno image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # US-517: build the edge image and scan it (base OS + Deno runtime) for
      # known vulnerabilities. Fails on HIGH/CRITICAL with a fix available.
      - name: Build edge image
        run: docker build -t gradethread-edge:scan services/edge-functions
      - name: Trivy vulnerability scan
        # Run Trivy from its official Docker image against the locally built edge
        # image (via the host docker socket). This deliberately avoids the
        # aquasecurity/trivy-action wrapper: their tag cleanup deleted the tags a
        # range of releases depend on (e.g. @0.28.0 → setup-trivy@v0.2.1, now
        # 404), and the newer wrapper's release-download installer flaked on the
        # runner. The pinned image is reproducible and pulls from Docker Hub.
        # Fails (exit 1) on HIGH/CRITICAL with a fix available; --ignore-unfixed
        # keeps it from blocking on advisories with no upstream patch yet.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            gradethread-edge:scan

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
