name: DB Migrations

# US-493: prove every migration applies cleanly, in order, on a FRESH schema.
# Fails the build if a migration references schema an earlier one didn't create —
# the class of bug that caused the prod 500s. Uses the Supabase CLI so the
# auth/storage/realtime schemas the migrations depend on exist (a vanilla
# Postgres would fail on the first auth.users / storage.* reference).

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrations.yml"
      # The two checks this job runs after the reset. Editing one without
      # re-running the job is how a broken probe sits green-adjacent for a
      # week — which is exactly what happened to the InitPlan check.
      - "scripts/db-rls-initplan-check.mjs"
      - "scripts/check-rpc-column-refs.mjs"
      - "scripts/check-session-revocation.mjs"
      - "scripts/check-inventory-writeoffs.mjs"
      - "scripts/db-denied-rpc-crash-check.mjs"
      # The six Books-and-Taxes money checks (US-2984..US-2990). Each one
      # asserts that two independent SQL paths reach the same number, which no
      # vitest case can express.
      - "scripts/check-ledger-invariant.mjs"
      - "scripts/check-sale-pnl-invariant.mjs"
      - "scripts/check-cogs-worksheet.mjs"
      - "scripts/check-facilitator-tax.mjs"
      - "scripts/check-1099k-bridge.mjs"
      - "scripts/check-mileage-log.mjs"
      - "scripts/check-home-office.mjs"
      - "scripts/check-statement-import.mjs"
      - "scripts/check-period-close.mjs"
      - "scripts/check-books-review.mjs"
      - "scripts/check-qbo-sync.mjs"
      - "scripts/check-statement-import.mjs"
      - "scripts/check-period-close.mjs"
      - "scripts/fixtures/**"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrations.yml"
      # The two checks this job runs after the reset. Editing one without
      # re-running the job is how a broken probe sits green-adjacent for a
      # week — which is exactly what happened to the InitPlan check.
      - "scripts/db-rls-initplan-check.mjs"
      - "scripts/check-rpc-column-refs.mjs"
      - "scripts/check-session-revocation.mjs"
      - "scripts/check-inventory-writeoffs.mjs"
      - "scripts/db-denied-rpc-crash-check.mjs"
      # The six Books-and-Taxes money checks (US-2984..US-2990). Each one
      # asserts that two independent SQL paths reach the same number, which no
      # vitest case can express.
      - "scripts/check-ledger-invariant.mjs"
      - "scripts/check-sale-pnl-invariant.mjs"
      - "scripts/check-cogs-worksheet.mjs"
      - "scripts/check-facilitator-tax.mjs"
      - "scripts/check-1099k-bridge.mjs"
      - "scripts/check-mileage-log.mjs"
      - "scripts/check-home-office.mjs"
      - "scripts/check-statement-import.mjs"
      - "scripts/check-period-close.mjs"
      - "scripts/check-books-review.mjs"
      - "scripts/check-qbo-sync.mjs"
      - "scripts/check-statement-import.mjs"
      - "scripts/check-period-close.mjs"
      - "scripts/fixtures/**"

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-apply:
    name: Migrations apply cleanly (supabase db reset)
    runs-on: ubuntu-latest
    # config.toml interpolates the Google OAuth creds + the Turnstile captcha
    # secret via env(), and the current CLI rejects an enabled provider/captcha
    # with empty values. This job only validates that migrations apply — neither
    # the OAuth nor the captcha handshake is ever exercised — so feed harmless
    # dummy values to satisfy the config parser.
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-client-id.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-secret
      # US-368: dummy Turnstile secret so [auth.captcha] parses (never verified here).
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots the local Supabase Postgres (with auth/storage schemas) and applies
      # EVERY migration in order. A migration that errors fails this step.
      - name: Start local stack + apply all migrations
        run: supabase db start
      # Belt-and-suspenders: a clean reset re-applies from scratch.
      - name: Reset (re-apply migrations from zero)
        run: supabase db reset --no-seed
      # US-1927: RLS policies must plan auth.uid() as a hoisted InitPlan, not
      # re-evaluate it per candidate row. The static rls-guard test pins the
      # policy TEXT; only EXPLAIN can pin the plan. Gates, because it passes.
      - name: RLS auth.uid() InitPlan check (US-1927)
        run: node scripts/db-rls-initplan-check.mjs
      # US-2663: this job APPLIES every migration and never CALLS anything they
      # create. CREATE FUNCTION does not validate a plpgsql body, so
      # revenue_dashboard installed cleanly while selecting a column that has
      # never existed on public.users, and raised 42703 on every call for months
      # with this lane green throughout. Executes each RPC the edge invokes,
      # each inside a transaction that is always rolled back.
      - name: RPC bodies resolve against the schema (US-2663)
        run: node scripts/check-rpc-column-refs.mjs
      # US-2662: same lesson, one level up. Stopping an impersonation posted to
      # a GoTrue admin route that does not exist on this version, so nothing was
      # ever revoked — and the guard asserted the route SOURCE contained the
      # call, which stayed true the whole time the feature did nothing. This
      # seeds a session, revokes it, and fails if the rows survive.
      - name: Session revocation actually revokes (US-2662)
        run: node scripts/check-session-revocation.mjs
      # US-3007: a completed sale was the ONLY exit from inventory, so an item
      # that was lost, donated or taken for personal use sat in ending inventory
      # for ever. That overstates Schedule C line 41, understates line 42 COGS,
      # and overstates the tax the seller owes - a bug that costs the user money
      # in the government's favour. Seeds three items, writes two off by
      # different routes, and asserts the resulting figures.
      - name: Written-off inventory leaves the books (US-3007)
        run: node scripts/check-inventory-writeoffs.mjs
      # US-2403: a permission-denied FUNCTION call SEGFAULTs the Supabase
      # Postgres image and takes the whole database down with it — reachable by
      # anyone holding the public anon key. continue-on-error because the stock
      # image is vulnerable TODAY: gating would turn every migration PR red on
      # arrival, and a permanently red check is one that gets deleted. This runs
      # to answer one question on every image bump — "is it still broken?" —
      # and to catch a regression once it is fixed. Drop continue-on-error the
      # moment the check goes green.
      # US-2984..US-2990: the Books and Taxes money checks. Each seeds a fixture
      # inside a transaction that ROLLS BACK, so they leave nothing behind and
      # are safe to run against any database with the migrations applied.
      #
      # They lived outside CI until now, each arguing in its own header that a
      # lane skipping silently when Docker is down teaches everyone to ignore
      # it. The two steps above are the counter-argument: db-backed, in this
      # lane, skipped cleanly by the same Docker gate. Six copies of that excuse
      # accumulated before the inconsistency was noticed.
      - name: Ledger equals finances_dashboard (US-2984)
        run: node scripts/check-ledger-invariant.mjs
      # US-3018: a THIRD route to the same number, so the team reports can group
      # profit by the person who sourced an item. 00143's per-sale pnl_net column
      # is not the dashboard's net -- the summary subtracts ship_extra on top of
      # it -- so a view that copies pnl_net is wrong only on accounts with legacy
      # shipments rows, which is to say the oldest ones.
      - name: sale_pnl equals finances_dashboard (US-3018)
        run: node scripts/check-sale-pnl-invariant.mjs
      - name: COGS worksheet and its cross-check (US-2986)
        run: node scripts/check-cogs-worksheet.mjs
      # Net profit is IDENTICAL on both tax branches, so only gross receipts
      # prove the facilitator branch was chosen correctly.
      - name: Facilitator vs seller-collected sales tax (US-2987)
        run: node scripts/check-facilitator-tax.mjs
      - name: 1099-K gross is branch-independent (US-2988)
        run: node scripts/check-1099k-bridge.mjs
      # The ledger rounds per trip and the summary must round the same way; they
      # diverged by a cent before this check existed.
      - name: Mileage ledger equals the summary (US-2989)
        run: node scripts/check-mileage-log.mjs
      # The cap applies to the footage BEFORE the months are prorated. The wrong
      # order gives $1,000 where the right one gives $750.
      - name: Home office caps before prorating (US-2990)
        run: node scripts/check-home-office.mjs
      # Matching a bank line to an expense is a claim about two records being
      # the same event. Its own header says it is registered in the db lane
      # with the rest, and it was not - guard-lane-parity caught that.
      - name: Bank statement matching (US-2994)
        run: node scripts/check-statement-import.mjs
      # The negative assertions are the point here: a local cash sale genuinely
      # has no fees and a $12 expense is under the substantiation threshold. A
      # queue that cries wolf gets ignored, and the real issue in it goes unread.
      - name: Books review queue and its false positives (US-2992)
        run: node scripts/check-books-review.mjs
      # Two assertions: a re-imported overlapping range must not duplicate, and
      # an expense already matched to one statement row must not be offered to
      # another -- two lines for one expense IS the double payment a bank
      # import exists to catch.
      - name: Statement import does not duplicate or double-match (US-2994)
        run: node scripts/check-statement-import.mjs
      # Every refusal is tested as `postgres`. The lock is a trigger rather than
      # an RLS policy precisely because the edge uses the service-role client,
      # which bypasses RLS -- a guard that only stops the browser stops nothing
      # that matters. The negative half counts too: shipping and renaming still
      # work inside a closed year, or the lock gets switched off.
      - name: A closed period refuses the service role (US-2995)
        run: node scripts/check-period-close.mjs
      # The grouping is the assertion a mock cannot make. Everything else about
      # the QuickBooks push is unit-tested against an in-memory Intuit; whether
      # a sale's five ledger entries become ONE document or five is decided in
      # SQL, and five would appear in QuickBooks as five unrelated receipts for
      # the same jacket. It also proves the SECURITY DEFINER tenant guard fires.
      - name: One sale is ONE QuickBooks document (US-2998)
        run: node scripts/check-qbo-sync.mjs
      - name: Denied-RPC crash check (advisory, US-2403)
        continue-on-error: true
        run: node scripts/db-denied-rpc-crash-check.mjs
