name: DB Migrations

# US-493: prove every migration applies cleanly, in order, on a FRESH schema.
# Fails the build if a migration references schema an earlier one didn't create —
# the class of bug that caused the prod 500s. Uses the Supabase CLI so the
# auth/storage/realtime schemas the migrations depend on exist (a vanilla
# Postgres would fail on the first auth.users / storage.* reference).

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrations.yml"
      # The two checks this job runs after the reset. Editing one without
      # re-running the job is how a broken probe sits green-adjacent for a
      # week — which is exactly what happened to the InitPlan check.
      - "scripts/db-rls-initplan-check.mjs"
      - "scripts/check-rpc-column-refs.mjs"
      - "scripts/check-session-revocation.mjs"
      - "scripts/check-inventory-writeoffs.mjs"
      - "scripts/db-denied-rpc-crash-check.mjs"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-migrations.yml"
      # The two checks this job runs after the reset. Editing one without
      # re-running the job is how a broken probe sits green-adjacent for a
      # week — which is exactly what happened to the InitPlan check.
      - "scripts/db-rls-initplan-check.mjs"
      - "scripts/check-rpc-column-refs.mjs"
      - "scripts/check-session-revocation.mjs"
      - "scripts/check-inventory-writeoffs.mjs"
      - "scripts/db-denied-rpc-crash-check.mjs"

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-apply:
    name: Migrations apply cleanly (supabase db reset)
    runs-on: ubuntu-latest
    # config.toml interpolates the Google OAuth creds + the Turnstile captcha
    # secret via env(), and the current CLI rejects an enabled provider/captcha
    # with empty values. This job only validates that migrations apply — neither
    # the OAuth nor the captcha handshake is ever exercised — so feed harmless
    # dummy values to satisfy the config parser.
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-client-id.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-secret
      # US-368: dummy Turnstile secret so [auth.captcha] parses (never verified here).
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Boots the local Supabase Postgres (with auth/storage schemas) and applies
      # EVERY migration in order. A migration that errors fails this step.
      - name: Start local stack + apply all migrations
        run: supabase db start
      # Belt-and-suspenders: a clean reset re-applies from scratch.
      - name: Reset (re-apply migrations from zero)
        run: supabase db reset --no-seed
      # US-1927: RLS policies must plan auth.uid() as a hoisted InitPlan, not
      # re-evaluate it per candidate row. The static rls-guard test pins the
      # policy TEXT; only EXPLAIN can pin the plan. Gates, because it passes.
      - name: RLS auth.uid() InitPlan check (US-1927)
        run: node scripts/db-rls-initplan-check.mjs
      # US-2663: this job APPLIES every migration and never CALLS anything they
      # create. CREATE FUNCTION does not validate a plpgsql body, so
      # revenue_dashboard installed cleanly while selecting a column that has
      # never existed on public.users, and raised 42703 on every call for months
      # with this lane green throughout. Executes each RPC the edge invokes,
      # each inside a transaction that is always rolled back.
      - name: RPC bodies resolve against the schema (US-2663)
        run: node scripts/check-rpc-column-refs.mjs
      # US-2662: same lesson, one level up. Stopping an impersonation posted to
      # a GoTrue admin route that does not exist on this version, so nothing was
      # ever revoked — and the guard asserted the route SOURCE contained the
      # call, which stayed true the whole time the feature did nothing. This
      # seeds a session, revokes it, and fails if the rows survive.
      - name: Session revocation actually revokes (US-2662)
        run: node scripts/check-session-revocation.mjs
      # US-3007: a completed sale was the ONLY exit from inventory, so an item
      # that was lost, donated or taken for personal use sat in ending inventory
      # for ever. That overstates Schedule C line 41, understates line 42 COGS,
      # and overstates the tax the seller owes - a bug that costs the user money
      # in the government's favour. Seeds three items, writes two off by
      # different routes, and asserts the resulting figures.
      - name: Written-off inventory leaves the books (US-3007)
        run: node scripts/check-inventory-writeoffs.mjs
      # US-2403: a permission-denied FUNCTION call SEGFAULTs the Supabase
      # Postgres image and takes the whole database down with it — reachable by
      # anyone holding the public anon key. continue-on-error because the stock
      # image is vulnerable TODAY: gating would turn every migration PR red on
      # arrival, and a permanently red check is one that gets deleted. This runs
      # to answer one question on every image bump — "is it still broken?" —
      # and to catch a regression once it is fixed. Drop continue-on-error the
      # moment the check goes green.
      - name: Denied-RPC crash check (advisory, US-2403)
        continue-on-error: true
        run: node scripts/db-denied-rpc-crash-check.mjs
