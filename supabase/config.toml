project_id = "gradethread"

[api]
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]

[auth]
site_url = "https://gradethread.com"
# US-379: exact-match redirect allow-list. EVERY OAuth/recovery/invite target the
# app sends users to must be listed here or GoTrue refuses the redirect. localhost
# entries are for LOCAL DEV ONLY — the production self-hosted GoTrue
# (GOTRUE_URI_ALLOW_LIST on api.gradethread.com) must contain ONLY the https URLs
# below, never localhost, and no wildcards (open-redirect safety).
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/reset-password",
  "http://localhost:5173/accept-invite",
  "https://gradethread.com/auth/callback",
  "https://gradethread.com/auth/reset-password",
  "https://gradethread.com/accept-invite",
  # US-661: iOS Universal Link auth callback. The app claims this path via
  # associated-domains (AASA at /.well-known/apple-app-site-association) so the
  # Google sign-in + recovery/magic-link redirects land on an https URL the app
  # owns instead of the claimable com.gradethread.app:// custom scheme. The
  # production GoTrue's GOTRUE_URI_ALLOW_LIST must include this exact URL too.
  "https://gradethread.com/app/auth-callback",
  # iOS < 17.4 fallback: those builds can't use the Universal Link callback, so
  # the Supabase Swift SDK redirects to the app's custom scheme instead
  # (SupabaseShared.customSchemeRedirectURL). Production GOTRUE_URI_ALLOW_LIST
  # needs this exact entry too or Google sign-in breaks on older iOS.
  "com.gradethread.app://auth-callback",
]
jwt_expiry = 3600
# US-375: rotate refresh tokens on every use and detect reuse of a revoked token
# (a sign of theft). The self-hosted GoTrue mirrors this with
# GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED=true and
# GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL=10; set an absolute session TTL
# there too (GOTRUE_SESSIONS_TIMEBOX) so a refreshed session can't live forever.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# US-367: server-authoritative password policy. The client shows a strength meter
# but GoTrue is the enforcer. minimum_password_length + required character classes
# are Supabase-CLI config keys; the self-hosted GoTrue mirrors them via
# GOTRUE_PASSWORD_MIN_LENGTH and GOTRUE_PASSWORD_REQUIRED_CHARACTERS, and
# breached-password rejection is enabled there with GOTRUE_SECURITY_PASSWORD_HIBP_ENABLED=true.
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

# US-369: brute-force protection. The client shows ONE generic message for every
# sign-in failure (no enumeration); throttling is enforced by GoTrue, which the
# app talks to directly. On the self-hosted instance set the rate limits via env:
#   GOTRUE_RATE_LIMIT_TOKEN_REFRESH, GOTRUE_RATE_LIMIT_VERIFY (per-IP login/verify
#   attempts per 5 min), GOTRUE_RATE_LIMIT_EMAIL_SENT, and
#   GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED=true. Tune VERIFY low enough to
#   throttle password-guessing per IP.

# US-368: CAPTCHA (Cloudflare Turnstile) on signup / login / password-reset to
# stop bot-driven trial-farming + credential-stuffing + reset-email floods. The
# self-hosted PRODUCTION GoTrue is the enforcer; mirror this there via env:
#   GOTRUE_SECURITY_CAPTCHA_ENABLED=true
#   GOTRUE_SECURITY_CAPTCHA_PROVIDER=turnstile   (or "hcaptcha")
#   GOTRUE_SECURITY_CAPTCHA_SECRET=<Turnstile secret key>
# Once captcha is ON, GoTrue REJECTS any signup/login/reset call that lacks a
# valid captcha token, so the FRONTEND must send one — it does, gated on
# VITE_TURNSTILE_SITE_KEY (see .env.example + components/auth/turnstile.tsx).
# Flip BOTH together: enable here / on prod GoTrue AND set the site key in the
# build, or auth breaks. With the site key unset the widget is a no-op (dev/local).
[auth.captcha]
enabled = true
provider = "turnstile"
# env() so no secret is committed; the current CLI rejects an enabled provider
# with an empty secret, so CI (db-migrations.yml) feeds a harmless dummy — it only
# validates that migrations apply, never the captcha handshake.
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# US-368: server-enforced auth throttling (anti trial-farming / credential-
# stuffing / reset-email floods). Mirror on prod GoTrue via the GOTRUE_RATE_LIMIT_*
# env vars above. These caps are the local-CLI equivalents.
[auth.rate_limit]
# Confirmation + recovery emails per hour (per project). A low cap is the primary
# defense against reset-email floods; still covers a signup-confirm + a reset
# within the same hour for a real user.
email_sent = 4
# Sign-up + sign-in requests per 5-minute window per IP address. Throttles
# scripted trial-account farming and password spraying from a single source.
sign_in_sign_ups = 30
# Magic-link / OTP / recovery-token verifications per 5 min per IP.
token_verifications = 30
# Session refreshes per 5 min per IP (generous — legit apps refresh often).
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Recovery (password-reset) links are single-use and short-lived. otp_expiry caps
# the link TTL (1 hour); GoTrue invalidates the token on first use (US-371).
otp_expiry = 3600

[auth.external.google]
enabled = true
# The current Supabase CLI rejects an enabled provider with an empty client_id/
# secret, so these are env() interpolations rather than committed placeholders
# (never commit OAuth secrets). Local dev / CI must export the two vars; the
# DB-migrations workflow sets dummy values since it only validates migrations,
# not the OAuth handshake. Production uses the self-hosted GoTrue, configured
# separately via GOTRUE_EXTERNAL_GOOGLE_* env — not this file.
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""

# Apple Sign In is iOS-NATIVE ONLY (AuthStore.signInWithApple →
# signInWithIdToken); the local throwaway stack never exercises it, so it stays
# disabled here to avoid forcing two more env vars on every `verify:db` run.
# PRODUCTION must enable it on the self-hosted GoTrue (see ENVIRONMENT.md
# "OAuth providers"): GOTRUE_EXTERNAL_APPLE_ENABLED=true,
# GOTRUE_EXTERNAL_APPLE_CLIENT_ID=com.gradethread.app (the BUNDLE ID — GoTrue
# validates the native identity token's `aud` against it), and
# GOTRUE_EXTERNAL_APPLE_SECRET=<ES256 JWT from the .p8 key>.
