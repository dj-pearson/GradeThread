# ⚠ THIS FILE IS NOT WHAT DEPLOYS PRODUCTION. US-2665.
# ⚠ A SETTING ADDED HERE IS NOT SHIPPED. IT IS A REFERENCE, NOT A DEPLOYMENT.
# ⚠ THE SETTINGS BELOW ARE OWNED BY vault/10-ops/edge-container-settings.md,
#   WHICH RECORDS WHAT EACH ONE IS AND WHICH COOLIFY FIELD MAKES IT TRUE.
#   CHANGE THAT NOTE AND THE COOLIFY UI. CHANGING THIS FILE CHANGES NOTHING.
#
# Measured 2026-08-17, re-measured 2026-09-11. All THREE parts of this file read
# as absent in production, not just one, and every check below is a public
# endpoint on functions.gradethread.com that needs no credentials:
#
#   environment: GET /health/metrics answers
#                  "memory": { "limit_mb": null, "headroom_pct": null }
#                while this file sets EDGE_MEMORY_LIMIT_MB: 2048. limit_mb is
#                read straight from that variable, so null means this block did
#                not boot the container. The same response answers
#                buffer_pipeline_cap 10 while this file declares 6 — production
#                DISAGREES with this file rather than merely omitting it, and 10
#                exceeds the sizing in vault/10-ops/capacity.md.
#
#   labels:      an OPTIONS preflight comes back with the Hono app's
#                access-control-allow-headers list, which includes
#                X-Workspace-Owner and X-GT-Extension-Id. The edge-cors Traefik
#                middleware declared below lists FOUR headers and would answer
#                the preflight itself. So these labels are not applied.
#
#   deploy:      not readable from outside. Assume absent. Settle it with
#                `docker inspect <edge-container> --format '{{.HostConfig.Memory}}'`
#                on the Coolify host; 0 means no limit.
#
# WHY THE FILE STILL EXISTS rather than being deleted. Deleting it was the
# preferred answer to AC2 and it is blocked from inside the repo:
# src/tests/compose-release-arg_test.ts asserts at least THREE building compose
# files exist, and removing this one leaves two, so the delete fails a guard in
# a directory this change was not allowed to touch. The second-best answer is
# the one taken here — keep it, and make it impossible to read as deployed:
# the banner above, a per-setting "LIVE?" note at each declaration, and
# src/test/edge-compose-not-deployed.test.ts, which fails if this banner is
# removed or if a setting declared here is not recorded in the vault note.
#
# WHICH MECHANISM DOES DEPLOY IT is still open. Two candidates, both with real
# evidence, both argued in vault/10-ops/deploy.md § 2: a Dockerfile build pack,
# or a compose build pack pointed at the sibling docker-compose.yml. One label
# settles it, on the Coolify host:
#
#   docker inspect <edge-container> --format \
#     '{{index .Config.Labels "com.docker.compose.project.config_files"}}'
#
# Hosts GradeThread + FlipDesk endpoints behind one container.
#
# ⚠ DO NOT "make this file the deployed one" as a fix. The steps used to be
# printed here and have been removed on purpose: re-pointing the live production
# API at this file would also apply the hand-written traefik.* router, CORS and
# body-limit labels below, which have never run and would replace the routing
# that currently works. The supported route to making these settings true is the
# Coolify UI, setting by setting, per vault/10-ops/edge-container-settings.md.

services:
  edge-functions:
    build:
      context: .
      dockerfile: Dockerfile
      # US-2001: pass the commit into the image so RELEASE_SHA is a real SHA and
      # every edge error/metric is attributable to a deploy. Prod was measured
      # serving release:"dev" — the Dockerfile's `ARG GIT_SHA=dev` default
      # survived into the image because nothing supplied the arg.
      #
      # DECLARED HERE, not in the Coolify UI, deliberately: the Dockerfile has
      # carried a comment telling the builder to set this since it was written,
      # and that comment did not survive contact with the actual deploy. A
      # build arg in the compose file is applied by the platform rather than
      # remembered by a person.
      #
      # Coolify exposes the commit as SOURCE_COMMIT. The `:-dev` fallback keeps
      # a plain `docker compose build` working locally; a dev/unknown value now
      # shows up as a DEGRADED observability line on /health/ready rather than
      # passing silently (see env-validation.ts isRealReleaseSha).
      args:
        GIT_SHA: ${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    expose:
      - "8787"
    # US-578: access-log retention/rotation. The app logs structured JSON to
    # stdout/stderr; Docker's json-file driver caps on-host log disk at
    # max-size × max-file = 10 MiB × 5 = 50 MiB per container (oldest file
    # dropped on roll-over). This is the enforced LOCAL retention bound and the
    # cost ceiling for on-box logs; longer-lived retention + the full log/trace
    # cost budget are documented in OBSERVABILITY.md. Trim verbosity at the
    # source with EDGE_TRACE_SAMPLE_RATE rather than growing these files.
    # LIVE? UNKNOWN - assume NO. Not readable from outside; needs
    # `docker inspect <c> --format '{{json .HostConfig.LogConfig}}'` on the host.
    # An empty Config means no rotation. Better home for this: log-driver /
    # log-opts in /etc/docker/daemon.json, which bounds Postgres too.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # US-2496: MAP form, not list form, and that is load-bearing.
      #
      # Coolify parses this file, merges its own env vars in, and re-serialises
      # it. A YAML SEQUENCE survives that round-trip as an array with INTEGER
      # keys, and the re-dumped file comes back as `environment: {0: "PORT=8787",
      # 1: ...}` — which compose rejects with
      # "non-string key in services.edge-functions.environment: 0" and the whole
      # deploy fails at the build step. A MAPPING round-trips as a mapping.
      #
      # A NULL value here is exactly equivalent to a bare `- VAR` list entry:
      # compose passes the variable through from the host ONLY when the host
      # actually has it, so an unset SOURCE_COMMIT still cannot clobber the
      # build-arg stamp with an empty string. Verified with `docker compose
      # config` — the rendered output is byte-identical to the list form.
      # LIVE? MOOT. main.ts defaults to 8787 when PORT is unset, so the service
      # listens on 8787 either way. Nothing turns on this one.
      PORT: "8787"
      # Marks this as the production runtime. Security debug flags (e.g.
      # WEBHOOK_PAYOUT_DEBUG) are ignored when EDGE_ENV=production. (US-266)
      # LIVE? YES, but set BY HAND in the Coolify UI on 2026-08-16 (US-2660),
      # not by this file. /health reports env "production".
      EDGE_ENV: production
      # US-2001 runtime half: null = pass through only when the host has it, so
      # an unset var cannot clobber the build-arg stamp above.
      # LIVE? WORKING. /health answers a real 40-char SHA that is the tip of
      # origin/main, and the same image reports the EXPECTED_SCHEMA_VERSION that
      # commit sets - two facts baked into one image agreeing. Whether the value
      # arrives as a build arg or as a hand-set COMMIT_SHA (COOLIFY.md documents
      # that stopgap) is not readable from outside; if hand-set it has to be
      # updated on EVERY deploy.
      SOURCE_COMMIT:
      COMMIT_SHA:
      # US-573: the container memory limit (MiB) the app reports against on
      # /health/metrics so the load-test gate + ops can compute headroom. Keep in
      # sync with deploy.resources.limits.memory below.
      # LIVE? NO. /health/metrics reports limit_mb: null (measured 2026-09-11),
      # so headroom is unknowable and the load-test gate compares against nothing.
      # Set it in Coolify -> Environment Variables.
      EDGE_MEMORY_LIMIT_MB: "2048"
      # US-578: edge trace/log sampling rate, the analogue of the frontend's
      # Sentry tracesSampleRate: 0.1 (src/main.tsx). Samples ONLY successful
      # (2xx/3xx) access lines + ok-outcome latency spans; every 4xx/5xx and all
      # business counters are always logged at 100%. Tune in OBSERVABILITY.md.
      # LIVE? ASSUME NO. Not readable from outside. The code default is 1.0
      # (observability.ts traceSampleRate), so unset means production logs 100%
      # of successful requests, ten times the volume this line intends.
      EDGE_TRACE_SAMPLE_RATE: "0.1"
      # US-573: max grading pipelines allowed to hold base64 image data resident
      # at once (the OOM bound — see grading-capacity.ts + vault/10-ops/capacity.md). Tuned so
      # worst-case residency stays under the 2G limit's 30% headroom target.
      # LIVE? NO, AND IT DISAGREES. /health/metrics reports
      # buffer_pipeline_cap: 10 (measured 2026-09-11). 10 is ~1 GB of peak base64
      # residency against the unset limit above. Decide 6 or 10 and set it in the
      # Coolify UI; capacity.md owns the sizing argument.
      GRADING_MAX_CONCURRENT_PIPELINES: "6"
    env_file:
      - .env
    # LIVE? YES, but from the Dockerfile's own HEALTHCHECK instruction, which
    # carries the same deno eval probe. The image has a healthcheck whether or
    # not any compose file is read. This one was filed as missing and is not.
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "fetch('http://127.0.0.1:8787/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1)).catch(() => Deno.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Coolify-managed Traefik routing.
      # The edge service lives on `functions.gradethread.com`; `api.gradethread.com`
      # is the self-hosted Supabase Kong on a separate container.
      - coolify.managed=true
      - coolify.name=gradethread-edge-functions
      - coolify.fqdn=${COOLIFY_FQDN:-https://functions.gradethread.com}
      - coolify.port=8787
      - coolify.healthcheckPath=/health
      # Direct Traefik labels (fallback if Coolify auto-detection is off)
      - traefik.enable=true
      - traefik.http.routers.edge-functions.rule=Host(`functions.gradethread.com`)
      - traefik.http.routers.edge-functions.entrypoints=https
      - traefik.http.routers.edge-functions.tls=true
      - traefik.http.routers.edge-functions.tls.certresolver=letsencrypt
      - traefik.http.services.edge-functions.loadbalancer.server.port=8787
      # ── CORS middleware (covers Traefik-level errors too) ──
      # When the upstream times out or 5xx's, Traefik returns the error
      # itself — without our Hono app's CORS headers. That makes the browser
      # surface "No 'Access-Control-Allow-Origin'" instead of the real error.
      # These headers fix that: Traefik sets them on every response.
      - traefik.http.middlewares.edge-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.edge-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-API-Key,X-Internal-Job-Secret
      # US-784: no localhost in the production CORS allow-list. Local dev talks to
      # a locally-run edge service, never this prod origin; app-level CORS in
      # main.ts already drops localhost in production, and this keeps the edge
      # (Traefik) layer consistent with it.
      - traefik.http.middlewares.edge-cors.headers.accesscontrolalloworiginlist=https://gradethread.com,https://www.gradethread.com,https://flipdesk.com,https://www.flipdesk.com
      - traefik.http.middlewares.edge-cors.headers.accesscontrolmaxage=86400
      - traefik.http.middlewares.edge-cors.headers.addvaryheader=true
      # Longer upstream timeouts — /listings/pull does N+M eBay API calls and
      # can legitimately take 30-60s for a large seller. The default Traefik
      # timeout (~30s) returns a 504 mid-call. Bump to 120s.
      - traefik.http.services.edge-functions.loadbalancer.responseforwarding.flushinterval=100ms
      # US-362: hard edge-of-network request-body cap. Traefik returns 413 once
      # the body exceeds this many bytes, BEFORE the request reaches the app, so
      # a chunked/Content-Length-spoofing upload can't pressure the container.
      # 16 MiB = the app's 15 MiB upload cap (body-limit.ts UPLOAD_MAX_BYTES)
      # plus multipart/base64 overhead headroom. memRequestBodyBytes keeps the
      # in-memory buffer bounded (spills to disk above it). Keep this in sync
      # with UPLOAD_MAX_BYTES if that changes.
      - traefik.http.middlewares.edge-bodylimit.buffering.maxRequestBodyBytes=16777216
      - traefik.http.middlewares.edge-bodylimit.buffering.memRequestBodyBytes=2097152
      - traefik.http.routers.edge-functions.middlewares=edge-cors,edge-bodylimit
    deploy:
      # US-573: right-sized from 1.5 CPU / 1G after profiling the in-process
      # base64 image buffering. The grading pipeline holds every submission's
      # photos as base64 data URIs (~1.33× the raw bytes) resident across the
      # vision analysis; worst-case (~8 photos near the 15 MiB upload cap) is
      # ~100 MB resident per submission. GRADING_MAX_CONCURRENT_PIPELINES=6
      # caps that to ~600 MB of base64; with the Deno baseline + caches + AI SDK
      # buffers, 2G keeps peak RSS under the 70% scale-out line (≥30% headroom).
      # Memory-based scale-out rule + the headroom target live in vault/10-ops/capacity.md.
      # Keep `memory` in sync with EDGE_MEMORY_LIMIT_MB above.
      # LIVE? UNKNOWN - assume NO. `docker inspect <c> --format
      # '{{.HostConfig.Memory}}'` settles it; 0 means no limit. The supported
      # place to set it is Coolify -> the edge app -> Resource Limits.
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
