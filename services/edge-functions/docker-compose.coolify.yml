# Coolify-ready compose for the consolidated edge service.
# Hosts GradeThread + FlipDesk endpoints behind one container.
#
# In Coolify:
#   1. New Resource → Docker Compose → point at this repo + this file.
#   2. Set environment variables (see .env.example).
#   3. Coolify reads the `coolify.fqdn` label and provisions a Traefik route
#      with Let's Encrypt for that hostname.
#
# Override the FQDN by exporting COOLIFY_FQDN before deploy (Coolify supports
# build-time arg interpolation).

services:
  edge-functions:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8787"
    # US-578: access-log retention/rotation. The app logs structured JSON to
    # stdout/stderr; Docker's json-file driver caps on-host log disk at
    # max-size × max-file = 10 MiB × 5 = 50 MiB per container (oldest file
    # dropped on roll-over). This is the enforced LOCAL retention bound and the
    # cost ceiling for on-box logs; longer-lived retention + the full log/trace
    # cost budget are documented in OBSERVABILITY.md. Trim verbosity at the
    # source with EDGE_TRACE_SAMPLE_RATE rather than growing these files.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - PORT=8787
      # Marks this as the production runtime. Security debug flags (e.g.
      # WEBHOOK_PAYOUT_DEBUG) are ignored when EDGE_ENV=production. (US-266)
      - EDGE_ENV=production
      # US-573: the container memory limit (MiB) the app reports against on
      # /health/metrics so the load-test gate + ops can compute headroom. Keep in
      # sync with deploy.resources.limits.memory below.
      - EDGE_MEMORY_LIMIT_MB=2048
      # US-578: edge trace/log sampling rate, the analogue of the frontend's
      # Sentry tracesSampleRate: 0.1 (src/main.tsx). Samples ONLY successful
      # (2xx/3xx) access lines + ok-outcome latency spans; every 4xx/5xx and all
      # business counters are always logged at 100%. Tune in OBSERVABILITY.md.
      - EDGE_TRACE_SAMPLE_RATE=0.1
      # US-573: max grading pipelines allowed to hold base64 image data resident
      # at once (the OOM bound — see grading-capacity.ts + CAPACITY.md). Tuned so
      # worst-case residency stays under the 2G limit's 30% headroom target.
      - GRADING_MAX_CONCURRENT_PIPELINES=6
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "fetch('http://127.0.0.1:8787/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1)).catch(() => Deno.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Coolify-managed Traefik routing.
      # The edge service lives on `functions.gradethread.com`; `api.gradethread.com`
      # is the self-hosted Supabase Kong on a separate container.
      - coolify.managed=true
      - coolify.name=gradethread-edge-functions
      - coolify.fqdn=${COOLIFY_FQDN:-https://functions.gradethread.com}
      - coolify.port=8787
      - coolify.healthcheckPath=/health
      # Direct Traefik labels (fallback if Coolify auto-detection is off)
      - traefik.enable=true
      - traefik.http.routers.edge-functions.rule=Host(`functions.gradethread.com`)
      - traefik.http.routers.edge-functions.entrypoints=https
      - traefik.http.routers.edge-functions.tls=true
      - traefik.http.routers.edge-functions.tls.certresolver=letsencrypt
      - traefik.http.services.edge-functions.loadbalancer.server.port=8787
      # ── CORS middleware (covers Traefik-level errors too) ──
      # When the upstream times out or 5xx's, Traefik returns the error
      # itself — without our Hono app's CORS headers. That makes the browser
      # surface "No 'Access-Control-Allow-Origin'" instead of the real error.
      # These headers fix that: Traefik sets them on every response.
      - traefik.http.middlewares.edge-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.edge-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-API-Key,X-Internal-Job-Secret
      # US-784: no localhost in the production CORS allow-list. Local dev talks to
      # a locally-run edge service, never this prod origin; app-level CORS in
      # main.ts already drops localhost in production, and this keeps the edge
      # (Traefik) layer consistent with it.
      - traefik.http.middlewares.edge-cors.headers.accesscontrolalloworiginlist=https://gradethread.com,https://www.gradethread.com,https://flipdesk.com,https://www.flipdesk.com
      - traefik.http.middlewares.edge-cors.headers.accesscontrolmaxage=86400
      - traefik.http.middlewares.edge-cors.headers.addvaryheader=true
      # Longer upstream timeouts — /listings/pull does N+M eBay API calls and
      # can legitimately take 30-60s for a large seller. The default Traefik
      # timeout (~30s) returns a 504 mid-call. Bump to 120s.
      - traefik.http.services.edge-functions.loadbalancer.responseforwarding.flushinterval=100ms
      # US-362: hard edge-of-network request-body cap. Traefik returns 413 once
      # the body exceeds this many bytes, BEFORE the request reaches the app, so
      # a chunked/Content-Length-spoofing upload can't pressure the container.
      # 16 MiB = the app's 15 MiB upload cap (body-limit.ts UPLOAD_MAX_BYTES)
      # plus multipart/base64 overhead headroom. memRequestBodyBytes keeps the
      # in-memory buffer bounded (spills to disk above it). Keep this in sync
      # with UPLOAD_MAX_BYTES if that changes.
      - traefik.http.middlewares.edge-bodylimit.buffering.maxRequestBodyBytes=16777216
      - traefik.http.middlewares.edge-bodylimit.buffering.memRequestBodyBytes=2097152
      - traefik.http.routers.edge-functions.middlewares=edge-cors,edge-bodylimit
    deploy:
      # US-573: right-sized from 1.5 CPU / 1G after profiling the in-process
      # base64 image buffering. The grading pipeline holds every submission's
      # photos as base64 data URIs (~1.33× the raw bytes) resident across the
      # vision analysis; worst-case (~8 photos near the 15 MiB upload cap) is
      # ~100 MB resident per submission. GRADING_MAX_CONCURRENT_PIPELINES=6
      # caps that to ~600 MB of base64; with the Deno baseline + caches + AI SDK
      # buffers, 2G keeps peak RSS under the 70% scale-out line (≥30% headroom).
      # Memory-based scale-out rule + the headroom target live in CAPACITY.md.
      # Keep `memory` in sync with EDGE_MEMORY_LIMIT_MB above.
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
