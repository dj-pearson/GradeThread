# Coolify-ready compose for the consolidated edge service.
# Hosts GradeThread + FlipDesk endpoints behind one container.
#
# In Coolify:
#   1. New Resource → Docker Compose → point at this repo + this file.
#   2. Set environment variables (see .env.example).
#   3. Coolify reads the `coolify.fqdn` label and provisions a Traefik route
#      with Let's Encrypt for that hostname.
#
# Override the FQDN by exporting COOLIFY_FQDN before deploy (Coolify supports
# build-time arg interpolation).

services:
  edge-functions:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      - PORT=8787
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "fetch('http://127.0.0.1:8787/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1)).catch(() => Deno.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      # Coolify-managed Traefik routing.
      # The edge service lives on `functions.gradethread.com`; `api.gradethread.com`
      # is the self-hosted Supabase Kong on a separate container.
      - coolify.managed=true
      - coolify.name=gradethread-edge-functions
      - coolify.fqdn=${COOLIFY_FQDN:-https://functions.gradethread.com}
      - coolify.port=8787
      - coolify.healthcheckPath=/health
      # Direct Traefik labels (fallback if Coolify auto-detection is off)
      - traefik.enable=true
      - traefik.http.routers.edge-functions.rule=Host(`functions.gradethread.com`)
      - traefik.http.routers.edge-functions.entrypoints=https
      - traefik.http.routers.edge-functions.tls=true
      - traefik.http.routers.edge-functions.tls.certresolver=letsencrypt
      - traefik.http.services.edge-functions.loadbalancer.server.port=8787
      # ── CORS middleware (covers Traefik-level errors too) ──
      # When the upstream times out or 5xx's, Traefik returns the error
      # itself — without our Hono app's CORS headers. That makes the browser
      # surface "No 'Access-Control-Allow-Origin'" instead of the real error.
      # These headers fix that: Traefik sets them on every response.
      - traefik.http.middlewares.edge-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - traefik.http.middlewares.edge-cors.headers.accesscontrolallowheaders=Content-Type,Authorization,X-API-Key,X-Internal-Job-Secret
      - traefik.http.middlewares.edge-cors.headers.accesscontrolalloworiginlist=https://gradethread.com,https://www.gradethread.com,https://flipdesk.com,https://www.flipdesk.com,http://localhost:5173
      - traefik.http.middlewares.edge-cors.headers.accesscontrolmaxage=86400
      - traefik.http.middlewares.edge-cors.headers.addvaryheader=true
      # Longer upstream timeouts — /listings/pull does N+M eBay API calls and
      # can legitimately take 30-60s for a large seller. The default Traefik
      # timeout (~30s) returns a 504 mid-call. Bump to 120s.
      - traefik.http.services.edge-functions.loadbalancer.responseforwarding.flushinterval=100ms
      - traefik.http.routers.edge-functions.middlewares=edge-cors
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
