# Production compose used by Coolify. For local development with hot-reload,
# use docker-compose.dev.yml (mounts ./src into the container).
services:
  edge-functions:
    build:
      context: .
      dockerfile: Dockerfile
      # US-2001: THIS FILE IS THE LEADING SUSPECT, so it gets the arg too.
      #
      # docker-compose.coolify.yml has carried GIT_SHA since 2026-07-19, and
      # production was STILL measured serving release:"dev" on 2026-08-02. The
      # previous pass listed "Coolify is deploying from docker-compose.yml
      # rather than the .coolify.yml variant" as cause (1) — and the very first
      # line of this file calls itself "Production compose used by Coolify",
      # which makes that reading entirely reasonable for whoever set the deploy
      # up. Declaring the arg in both files means the answer to "which compose
      # file is it actually using?" stops mattering.
      #
      # Dockerfile has `ARG GIT_SHA=dev`; without this the default survives into
      # the image and every Sentry event ships tagged "dev". `:-dev` keeps a
      # plain local `docker compose build` working, and a dev/unknown value
      # surfaces as a DEGRADED features.release on /health/ready rather than
      # passing silently (env-validation.ts isRealReleaseSha).
      args:
        GIT_SHA: ${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      - PORT=8787
      # US-2001, the RUNTIME half. The build-arg above is a build-time stamp; if
      # the builder does not pass it, the image bakes in "dev" and nothing later
      # can correct it. These are bare pass-throughs (no `=`), which set the
      # variable in the container ONLY when the host actually has it — so an
      # unset SOURCE_COMMIT leaves the build-arg stamp intact instead of
      # clobbering a good SHA with an empty string. That distinction is the
      # whole reason this is not written `- SOURCE_COMMIT=${SOURCE_COMMIT:-dev}`.
      #
      # With release-identity.ts falling through placeholder VALUES rather than
      # only unset keys, setting either of these as an ordinary Coolify env var
      # now fixes an unattributable release without a rebuild.
      - SOURCE_COMMIT
      - COMMIT_SHA
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "fetch('http://127.0.0.1:8787/health').then(r => r.ok ? Deno.exit(0) : Deno.exit(1)).catch(() => Deno.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      # Coolify reads these to provision a Traefik route with Let's Encrypt.
      # The edge service lives on `functions.gradethread.com`; the `api.*` host
      # is the self-hosted Supabase Kong on a separate container.
      - coolify.managed=true
      - coolify.name=gradethread-edge-functions
      - coolify.fqdn=${COOLIFY_FQDN:-https://functions.gradethread.com}
      - coolify.port=8787
      - coolify.healthcheckPath=/health
